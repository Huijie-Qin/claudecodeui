name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy signed artifacts to the stable update server
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  DESKTOP_HOME_URL: ${{ vars.DESKTOP_HOME_URL }}
  DESKTOP_UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
  DESKTOP_ALLOWED_ORIGINS: ${{ vars.DESKTOP_ALLOWED_ORIGINS }}
  DESKTOP_AUTH_ORIGINS: ${{ vars.DESKTOP_AUTH_ORIGINS }}
  DESKTOP_REQUIRE_SIGNING: 'true'

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate desktop tag version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        shell: bash
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#desktop-v}"
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          test "$EXPECTED_VERSION" = "$ACTUAL_VERSION"
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Configure Apple notarization key
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      - name: Test and build Universal macOS release
        run: npm --prefix desktop run test && npm --prefix desktop run package:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS fuses, signature, and notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE='desktop/dist/mac-universal/mac-universal/CloudCLI.app'
          test -d "$APP_BUNDLE"
          npm --prefix desktop run verify:fuses -- "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          spctl --assess --type execute --verbose=2 "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"
          DMG_FILES=(desktop/dist/mac-universal/*.dmg)
          test "${#DMG_FILES[@]}" -eq 1
          codesign --verify --verbose=2 "${DMG_FILES[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${DMG_FILES[0]}"
      - name: Upload macOS updater files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/dist/mac-universal/*.dmg
            desktop/dist/mac-universal/*.zip
            desktop/dist/mac-universal/*.blockmap
            desktop/dist/mac-universal/latest-mac.yml

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate desktop tag version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        shell: bash
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#desktop-v}"
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          test "$EXPECTED_VERSION" = "$ACTUAL_VERSION"
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Test and build Windows x64 release
        run: npm --prefix desktop run test && npm --prefix desktop run package:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Windows fuses
        shell: bash
        run: npm --prefix desktop run verify:fuses -- 'desktop/dist/win-x64/win-unpacked/CloudCLI.exe'
      - name: Verify Windows Authenticode signatures
        shell: pwsh
        run: |
          $targets = @('desktop/dist/win-x64/win-unpacked/CloudCLI.exe')
          $targets += @(Get-ChildItem -Path 'desktop/dist/win-x64' -Filter '*-win-x64.exe' -File | ForEach-Object FullName)
          if ($targets.Count -ne 2) {
            throw "Expected the application executable and one NSIS installer, found $($targets.Count)."
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${target}: $($signature.Status)"
            }
          }
      - name: Upload Windows updater files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/dist/win-x64/*.exe
            desktop/dist/win-x64/*.blockmap
            desktop/dist/win-x64/latest.yml

  deploy:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.deploy == true
    runs-on: ubuntu-latest
    environment: desktop-production
    concurrency:
      group: cloudcli-desktop-stable-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: desktop-macos
          path: downloaded/macos
      - uses: actions/download-artifact@v5
        with:
          name: desktop-windows
          path: downloaded/windows
      - name: Prepare and hash release layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/latest/mac/universal release/latest/win/x64
          find downloaded/macos -maxdepth 5 -type f -exec cp '{}' release/latest/mac/universal/ \;
          find downloaded/windows -maxdepth 5 -type f -exec cp '{}' release/latest/win/x64/ \;
          test -f release/latest/mac/universal/latest-mac.yml
          test -f release/latest/win/x64/latest.yml
          compgen -G 'release/latest/mac/universal/*.dmg' > /dev/null
          compgen -G 'release/latest/mac/universal/*.zip' > /dev/null
          compgen -G 'release/latest/mac/universal/*.blockmap' > /dev/null
          compgen -G 'release/latest/win/x64/*.exe' > /dev/null
          compgen -G 'release/latest/win/x64/*.blockmap' > /dev/null
          grep -E '^(path:|  - url:)' release/latest/mac/universal/latest-mac.yml \
            | sed -E 's/^(path:|  - url:) //' \
            | while IFS= read -r release_file; do
                test -f "release/latest/mac/universal/$release_file"
              done
          grep -E '^(path:|  - url:)' release/latest/win/x64/latest.yml \
            | sed -E 's/^(path:|  - url:) //' \
            | while IFS= read -r release_file; do
                test -f "release/latest/win/x64/$release_file"
              done
          test -z "$(find release/latest/mac/universal -maxdepth 1 -type f \
            ! -name 'latest-mac.yml' ! -name '*.dmg' ! -name '*.zip' ! -name '*.blockmap' -print -quit)"
          test -z "$(find release/latest/win/x64 -maxdepth 1 -type f \
            ! -name 'latest.yml' ! -name '*.exe' ! -name '*.blockmap' -print -quit)"
          (
            cd release/latest/mac/universal
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          (
            cd release/latest/win/x64
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
        working-directory: .
      - name: Configure deployment SSH key
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DESKTOP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DESKTOP_DEPLOY_KNOWN_HOSTS }}
      - name: Upload, verify, and atomically publish metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DESKTOP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DESKTOP_DEPLOY_USER }}
          UPDATE_ROOT: ${{ vars.DESKTOP_UPDATE_ROOT }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$UPDATE_ROOT" =~ ^/[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)+$ ]]
          DEPLOY_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_STAGE="$UPDATE_ROOT/.staging/$DEPLOY_ID"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "$TARGET" "mkdir -p '$REMOTE_STAGE/latest/mac/universal' '$REMOTE_STAGE/latest/win/x64'"
          rsync -az release/latest/mac/universal/ "$TARGET:$REMOTE_STAGE/latest/mac/universal/"
          rsync -az release/latest/win/x64/ "$TARGET:$REMOTE_STAGE/latest/win/x64/"
          rsync -az desktop/scripts/publish-update-stage.sh "$TARGET:$REMOTE_STAGE/publish-update-stage.sh"
          ssh "$TARGET" "bash '$REMOTE_STAGE/publish-update-stage.sh' '$UPDATE_ROOT' '$DEPLOY_ID'"
