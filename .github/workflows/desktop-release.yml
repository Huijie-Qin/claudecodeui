name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy signed artifacts to the stable update server
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  DESKTOP_UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
  DESKTOP_REQUIRE_SIGNING: 'true'

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Validate desktop tag version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        shell: bash
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#desktop-v}"
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          test "$EXPECTED_VERSION" = "$ACTUAL_VERSION"
      - name: Install application and desktop dependencies
        run: |
          npm ci
          npm --prefix desktop ci
      - name: Configure Apple notarization key
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      - name: Test and build Universal macOS release
        run: npm --prefix desktop run test && npm --prefix desktop run package:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS fuses, signature, and notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE='desktop/dist/mac-universal/mac-universal/CloudCLI.app'
          test -d "$APP_BUNDLE"
          RUNTIME="$APP_BUNDLE/Contents/Resources/runtime"
          test -f "$RUNTIME/dist/index.html"
          test -f "$RUNTIME/dist-server/server/index.js"
          test -f "$RUNTIME/server/services/hook-python-runner.py"
          test -f "$RUNTIME/node_modules/better-sqlite3/package.json"
          test -f "$RUNTIME/node/darwin-arm64/npm/bin/npm-cli.js"
          test -f "$RUNTIME/node/darwin-x64/npm/bin/npm-cli.js"
          test -x "$RUNTIME/node/darwin-arm64/bin/npm"
          test -x "$RUNTIME/node/darwin-arm64/bin/npx"
          test -x "$RUNTIME/node/darwin-x64/bin/npm"
          test -x "$RUNTIME/node/darwin-x64/bin/npx"
          test -x "$RUNTIME/claude/darwin-arm64/claude"
          test -x "$RUNTIME/claude/darwin-x64/claude"
          test -x "$RUNTIME/node/darwin-arm64/node"
          test -x "$RUNTIME/node/darwin-x64/node"
          test ! -e "$RUNTIME/claude/win32-x64"
          test ! -e "$RUNTIME/node/win32-x64"
          file "$RUNTIME/claude/darwin-arm64/claude" | grep -q 'arm64'
          file "$RUNTIME/claude/darwin-x64/claude" | grep -q 'x86_64'
          test "$(lipo -archs "$RUNTIME/node/darwin-arm64/node")" = 'arm64'
          test "$(lipo -archs "$RUNTIME/node/darwin-x64/node")" = 'x86_64'
          PTY_RELEASE="$RUNTIME/node_modules/node-pty/build/Release"
          test -f "$PTY_RELEASE/pty.node"
          test -x "$PTY_RELEASE/spawn-helper"
          lipo -archs "$PTY_RELEASE/pty.node" | grep -q 'arm64'
          lipo -archs "$PTY_RELEASE/pty.node" | grep -q 'x86_64'
          lipo -archs "$PTY_RELEASE/spawn-helper" | grep -q 'arm64'
          lipo -archs "$PTY_RELEASE/spawn-helper" | grep -q 'x86_64'
          grep -q 'CLOUDCLI_NODE_EXECUTABLE || process.execPath' \
            "$RUNTIME/node_modules/node-pty/lib/windowsPtyAgent.js"
          ELECTRON_RUN_AS_NODE=1 \
            desktop/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron \
            desktop/scripts/smoke-native-runtime.cjs "$RUNTIME"
          case "$(uname -m)" in
            arm64) NODE_ARCH='arm64' ;;
            x86_64) NODE_ARCH='x64' ;;
            *) echo 'Unsupported macOS runner architecture.' >&2; exit 1 ;;
          esac
          NODE_EXECUTABLE="$RUNTIME/node/darwin-$NODE_ARCH/node"
          NPM_CLI="$RUNTIME/node/darwin-$NODE_ARCH/npm/bin/npm-cli.js"
          TOOLCHAIN_BIN="$RUNTIME/node/darwin-$NODE_ARCH/bin"
          "$NODE_EXECUTABLE" -p 'process.version'
          "$NODE_EXECUTABLE" "$NPM_CLI" --version
          env -i HOME="$RUNNER_TEMP" PATH="$TOOLCHAIN_BIN:$(dirname "$NODE_EXECUTABLE"):/usr/bin:/bin" \
            npm --version
          env -i HOME="$RUNNER_TEMP" PATH="$TOOLCHAIN_BIN:$(dirname "$NODE_EXECUTABLE"):/usr/bin:/bin" \
            npx --version
          TOOLCHAIN_SMOKE="$RUNNER_TEMP/cloudcli-plugin-toolchain-smoke"
          mkdir -p "$TOOLCHAIN_SMOKE"
          printf '%s\n' '{"scripts":{"smoke":"node smoke.js"}}' > "$TOOLCHAIN_SMOKE/package.json"
          printf '%s\n' 'const path = require("node:path"); if (path.resolve(process.execPath) !== path.resolve(process.env.CLOUDCLI_EXPECTED_NODE)) process.exit(23);' > "$TOOLCHAIN_SMOKE/smoke.js"
          env -i HOME="$RUNNER_TEMP" \
            PATH="$TOOLCHAIN_BIN:$(dirname "$NODE_EXECUTABLE"):/usr/bin:/bin" \
            CLOUDCLI_EXPECTED_NODE="$NODE_EXECUTABLE" \
            npm --prefix "$TOOLCHAIN_SMOKE" run smoke --silent
          if test "$(uname -m)" = 'arm64'; then
            "$RUNTIME/claude/darwin-arm64/claude" --version
          else
            "$RUNTIME/claude/darwin-x64/claude" --version
          fi
          npm --prefix desktop run verify:fuses -- "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign --verify --strict --verbose=2 "$RUNTIME/node/darwin-arm64/node"
          codesign --verify --strict --verbose=2 "$RUNTIME/node/darwin-x64/node"
          spctl --assess --type execute --verbose=2 "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"
          DMG_FILES=(desktop/dist/mac-universal/*.dmg)
          test "${#DMG_FILES[@]}" -eq 1
          codesign --verify --verbose=2 "${DMG_FILES[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${DMG_FILES[0]}"
      - name: Upload macOS updater files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/dist/mac-universal/*.dmg
            desktop/dist/mac-universal/*.zip
            desktop/dist/mac-universal/*.blockmap
            desktop/dist/mac-universal/latest-mac.yml

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Validate desktop tag version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        shell: bash
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#desktop-v}"
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          test "$EXPECTED_VERSION" = "$ACTUAL_VERSION"
      - name: Install application and desktop dependencies
        run: |
          npm ci
          npm --prefix desktop ci
      - name: Test and build Windows x64 release
        run: npm --prefix desktop run test && npm --prefix desktop run package:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Windows fuses
        shell: bash
        run: npm --prefix desktop run verify:fuses -- 'desktop/dist/win-x64/win-unpacked/CloudCLI.exe'
      - name: Verify bundled Windows runtime
        shell: pwsh
        run: |
          $runtime = 'desktop/dist/win-x64/win-unpacked/resources/runtime'
          $required = @(
            "$runtime/dist/index.html",
            "$runtime/dist-server/server/index.js",
            "$runtime/server/services/hook-python-runner.py",
            "$runtime/node_modules/better-sqlite3/package.json",
            "$runtime/node_modules/node-pty/build/Release/conpty.node",
            "$runtime/node_modules/node-pty/build/Release/conpty_console_list.node",
            "$runtime/node_modules/node-pty/build/Release/conpty/conpty.dll",
            "$runtime/node_modules/node-pty/build/Release/conpty/OpenConsole.exe",
            "$runtime/node_modules/node-pty/lib/windowsPtyAgent.js",
            "$runtime/node/win32-x64/npm/bin/npm-cli.js",
            "$runtime/node/win32-x64/bin/npm",
            "$runtime/node/win32-x64/bin/npm.cmd",
            "$runtime/node/win32-x64/bin/npm.ps1",
            "$runtime/node/win32-x64/bin/npx",
            "$runtime/node/win32-x64/bin/npx.cmd",
            "$runtime/node/win32-x64/bin/npx.ps1",
            "$runtime/node/win32-x64/node.exe",
            "$runtime/claude/win32-x64/claude.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing packaged runtime file: $file"
            }
          }
          if ((Test-Path -LiteralPath "$runtime/claude/darwin-arm64") -or (Test-Path -LiteralPath "$runtime/claude/darwin-x64")) {
            throw 'Windows package contains unnecessary macOS Claude binaries.'
          }
          if ((Test-Path -LiteralPath "$runtime/node/darwin-arm64") -or (Test-Path -LiteralPath "$runtime/node/darwin-x64")) {
            throw 'Windows package contains unnecessary macOS Node binaries.'
          }
          & "$runtime/claude/win32-x64/claude.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Claude CLI failed with exit code $LASTEXITCODE"
          }
          $nodeExecutable = (Resolve-Path -LiteralPath "$runtime/node/win32-x64/node.exe").Path
          & $nodeExecutable -p 'process.version'
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Node runtime failed with exit code $LASTEXITCODE"
          }
          $npmCli = "$runtime/node/win32-x64/npm/bin/npm-cli.js"
          & $nodeExecutable $npmCli --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled npm CLI failed with exit code $LASTEXITCODE"
          }
          $nodePtyAgent = Get-Content -Raw -LiteralPath "$runtime/node_modules/node-pty/lib/windowsPtyAgent.js"
          if ($nodePtyAgent -notmatch 'CLOUDCLI_NODE_EXECUTABLE \|\| process\.execPath') {
            throw 'Packaged node-pty does not use the bundled Node runtime for its console agent.'
          }
          $toolchainBin = "$runtime/node/win32-x64/bin"
          $env:PATH = "$toolchainBin;$(Split-Path -Parent $nodeExecutable);$env:SystemRoot\System32;$env:SystemRoot"
          & "$toolchainBin/npm.cmd" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled npm shim failed with exit code $LASTEXITCODE"
          }
          & "$toolchainBin/npx.cmd" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled npx shim failed with exit code $LASTEXITCODE"
          }
          $toolchainSmoke = Join-Path $env:RUNNER_TEMP 'cloudcli-plugin-toolchain-smoke'
          New-Item -ItemType Directory -Force -Path $toolchainSmoke | Out-Null
          Set-Content -LiteralPath (Join-Path $toolchainSmoke 'package.json') -NoNewline -Value '{"scripts":{"smoke":"node smoke.js"}}'
          Set-Content -LiteralPath (Join-Path $toolchainSmoke 'smoke.js') -NoNewline -Value 'const path = require("node:path"); if (path.resolve(process.execPath).toLowerCase() !== path.resolve(process.env.CLOUDCLI_EXPECTED_NODE).toLowerCase()) process.exit(23);'
          $env:CLOUDCLI_EXPECTED_NODE = $nodeExecutable
          & "$toolchainBin/npm.cmd" --prefix $toolchainSmoke run smoke --silent
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled npm script PATH smoke failed with exit code $LASTEXITCODE"
          }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:CLOUDCLI_NODE_EXECUTABLE = $nodeExecutable
          & 'desktop/node_modules/electron/dist/electron.exe' 'desktop/scripts/smoke-native-runtime.cjs' $runtime
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Electron-ABI native module smoke failed with exit code $LASTEXITCODE"
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          Remove-Item Env:CLOUDCLI_NODE_EXECUTABLE
      - name: Verify Windows Authenticode signatures
        shell: pwsh
        run: |
          $targets = @(
            'desktop/dist/win-x64/win-unpacked/CloudCLI.exe',
            'desktop/dist/win-x64/win-unpacked/resources/runtime/node/win32-x64/node.exe'
          )
          $targets += @(Get-ChildItem -Path 'desktop/dist/win-x64' -Filter '*-win-x64.exe' -File | ForEach-Object FullName)
          if ($targets.Count -ne 3) {
            throw "Expected the application, bundled Node runtime, and one NSIS installer, found $($targets.Count)."
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${target}: $($signature.Status)"
            }
          }
      - name: Upload Windows updater files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/dist/win-x64/*.exe
            desktop/dist/win-x64/*.blockmap
            desktop/dist/win-x64/latest.yml

  deploy:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.deploy == true
    runs-on: ubuntu-latest
    environment: desktop-production
    concurrency:
      group: cloudcli-desktop-stable-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: desktop-macos
          path: downloaded/macos
      - uses: actions/download-artifact@v5
        with:
          name: desktop-windows
          path: downloaded/windows
      - name: Prepare and hash release layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/latest/mac/universal release/latest/win/x64
          find downloaded/macos -maxdepth 5 -type f -exec cp '{}' release/latest/mac/universal/ \;
          find downloaded/windows -maxdepth 5 -type f -exec cp '{}' release/latest/win/x64/ \;
          test -f release/latest/mac/universal/latest-mac.yml
          test -f release/latest/win/x64/latest.yml
          compgen -G 'release/latest/mac/universal/*.dmg' > /dev/null
          compgen -G 'release/latest/mac/universal/*.zip' > /dev/null
          compgen -G 'release/latest/mac/universal/*.blockmap' > /dev/null
          compgen -G 'release/latest/win/x64/*.exe' > /dev/null
          compgen -G 'release/latest/win/x64/*.blockmap' > /dev/null
          grep -E '^(path:|  - url:)' release/latest/mac/universal/latest-mac.yml \
            | sed -E 's/^(path:|  - url:) //' \
            | while IFS= read -r release_file; do
                test -f "release/latest/mac/universal/$release_file"
              done
          grep -E '^(path:|  - url:)' release/latest/win/x64/latest.yml \
            | sed -E 's/^(path:|  - url:) //' \
            | while IFS= read -r release_file; do
                test -f "release/latest/win/x64/$release_file"
              done
          test -z "$(find release/latest/mac/universal -maxdepth 1 -type f \
            ! -name 'latest-mac.yml' ! -name '*.dmg' ! -name '*.zip' ! -name '*.blockmap' -print -quit)"
          test -z "$(find release/latest/win/x64 -maxdepth 1 -type f \
            ! -name 'latest.yml' ! -name '*.exe' ! -name '*.blockmap' -print -quit)"
          (
            cd release/latest/mac/universal
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          (
            cd release/latest/win/x64
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
        working-directory: .
      - name: Configure deployment SSH key
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DESKTOP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DESKTOP_DEPLOY_KNOWN_HOSTS }}
      - name: Upload, verify, and atomically publish metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DESKTOP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DESKTOP_DEPLOY_USER }}
          UPDATE_ROOT: ${{ vars.DESKTOP_UPDATE_ROOT }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$UPDATE_ROOT" =~ ^/[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)+$ ]]
          DEPLOY_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_STAGE="$UPDATE_ROOT/.staging/$DEPLOY_ID"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "$TARGET" "mkdir -p '$REMOTE_STAGE/latest/mac/universal' '$REMOTE_STAGE/latest/win/x64'"
          rsync -az release/latest/mac/universal/ "$TARGET:$REMOTE_STAGE/latest/mac/universal/"
          rsync -az release/latest/win/x64/ "$TARGET:$REMOTE_STAGE/latest/win/x64/"
          rsync -az desktop/scripts/publish-update-stage.sh "$TARGET:$REMOTE_STAGE/publish-update-stage.sh"
          ssh "$TARGET" "bash '$REMOTE_STAGE/publish-update-stage.sh' '$UPDATE_ROOT' '$DEPLOY_ID'"
