/* =========================================================
   列表 + 详情子页面（递进导航）
   ========================================================= */
function applyFilters(base){
  let list = base.filter(s=>{
    if(state.statusFilter!=='all' && s.status!==state.statusFilter) return false;
    if(state.groupFilter && s.group!==state.groupFilter) return false;
    if(state.search){
      const q=state.search.toLowerCase();
      const d=s.desc;
      const hay=[s.name,s.display,d.summary,(d.triggers||[]).join(','),(d.keywords||[]).join(','),s.area].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  // 市场：已安装置顶，再按 pin；我的技能保持原序
  if(state.view!=='mine') list.sort((a,b)=> (b.installed?1:0)-(a.installed?1:0) || (b.pinned?1:0)-(a.pinned?1:0));
  return list;
}

function renderMarket(){ state.selectedSkillId&&skillById(state.selectedSkillId)?renderSkillPage():renderListPage(); }
function renderMine(){ state.selectedSkillId&&skillById(state.selectedSkillId)?renderSkillPage():renderListPage(); }

function renderListPage(){
  const view = state.view;
  let base, showStatus, showInstall, showSource;
  if(view==='market'){ base=state.skills.filter(s=>s.status==='published'); showStatus=false; showInstall=true; showSource=false; }
  else { base=state.skills.filter(s=>s.local); showStatus=true; showInstall=false; showSource=true; }
  const list = applyFilters(base);
  const installed = state.skills.filter(s=>s.installed);
  const upd = state.skills.filter(s=>s.updateAvailable).length;

  const groupStrip = state.categories.map(c=>{
    const cnt = base.filter(s=>s.group===c.code).length;
    const active = state.groupFilter===c.code;
    return `<button onclick="toggleGroup('${c.code}')" class="flex items-center gap-1.5 pill px-2.5 py-1 text-[12px] border ${active?'border-brand-500 bg-brand-50 text-brand-700':'border-slate-200 text-slate-600 hover:bg-slate-50'}">${dot(c.color)} ${c.name} <span class="text-slate-400">${cnt}</span></button>`;
  }).join('');

  const statusStrip = view==='mine' ? `<div class="flex items-center gap-3 mt-2 text-[12px] text-slate-500">状态：${['all','published','in_review','draft'].map(st=>`<button onclick="setStatus('${st}')" class="${state.statusFilter===st?'text-brand-700 font-medium':'hover:text-slate-700'}">${st==='all'?'全部':({published:'已发布',in_review:'评审中',draft:'草稿'}[st])}</button>`).join('')}</div>` : '';

  let header;
  if(view==='market'){
    header = listHeader({
      title:'技能市场',
      subtitle:'浏览已发布技能，安装 / 卸载到当前 workspace',
      placeholder:'搜索技能名 / 触发词 / 关键词…',
      right:`<div class="flex items-center gap-2 text-[12px] text-slate-500">
          <span>已发布 <b class="text-brand-600">${base.length}</b></span><span class="text-slate-300">·</span>
          <span>已安装 <b class="text-emerald-600">${installed.length}</b></span><span class="text-slate-300">·</span>
          <span>待更新 <b class="text-amber-600">${upd}</b></span>
        </div>`,
      groupStrip,
    });
  } else {
    header = listHeader({
      title:'我的技能',
      subtitle:'workspace <span class="font-mono">.claude/skills</span> 下的全部技能（本地创建 / 文件上传 / 从市场安装），支持编辑、调试、测评',
      placeholder:'搜索我的技能…',
      right:`<button onclick="openUploadSkill()" class="px-3 py-1.5 border border-slate-300 rounded-md text-[13px] hover:bg-slate-50">↑ 上传技能</button>
        <button onclick="openCreate('t4')" class="px-3 py-1.5 bg-brand-600 text-white rounded-md text-[13px] hover:bg-brand-700">+ 新建技能</button>`,
      groupStrip, statusStrip,
    });
  }

  $('#content').innerHTML = `${header}
    <div class="mb-2 text-[12px] text-slate-400">共 ${list.length} 个</div>
    <div class="card divide-y divide-slate-50">${list.length?list.map(s=>skillRowWide(s,showStatus,showInstall,showSource)).join(''):'<div class="p-8 text-center text-slate-400 text-[13px]">无匹配技能</div>'}</div>
  `;
}

function skillRowWide(s, showStatus, showInstall, showSource){

  const actionBtn = !showInstall ? '' :
    s.local
      ? `<button onclick="event.stopPropagation();uninstallSkill('${s.id}')" class="text-[11px] px-2 py-1 border border-slate-300 rounded text-slate-600 hover:bg-red-50 hover:text-red-600 hover:border-red-300 flex-none">卸载</button>`

  const src = (showSource && s.source) ? (()=>{ const [t,col]=SOURCE_LABEL[s.source]; return `<span class="pill px-1.5 py-0 text-[10px]" style="background:${col}14;color:${col}">${t}</span>`; })() : '';
  return `
  <div onclick="openDetail('${s.id}')" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 cursor-pointer fade-in">
    ${dot(c.color)}
    <div class="w-52 flex-none">

        <span class="font-medium text-slate-800">${s.display}</span>

        ${s.updateAvailable?'<span class="pill px-1.5 py-0 text-[10px] bg-blue-100 text-blue-700">待更新</span>':''}
        ${src}
      </div>
      <div class="text-[11px] text-slate-400 font-mono">${s.name} · v${s.version}</div>
    </div>
    <div class="w-24 flex-none text-[11px] text-slate-500">${c.name}<div class="text-slate-400">${s.area}</div></div>
    <div class="flex-1 truncate text-slate-600 text-[12px]">${s.desc.summary}</div>
    ${showStatus?`<div class="w-16 flex-none">${statusBadge(s)}</div>`:''}
    ${actionBtn}
    <div class="flex-none text-slate-300 text-lg">›</div>

function runEval(){

  state.evalRunning=true; renderDetailBody();
  let p=0; const id=state.selectedSkillId;

/* Radar chart (SVG) */
function radar(q){
  const axes=[['触发',q.trigger],['装配',q.assembly],['安全',q.safety],['质量',q.quality],['效率',q.efficiency]];
  const cx=80,cy=80,R=60,n=axes.length;
  const pts=axes.map((a,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/n; const r=R*a[1]/100; return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)]; });
  const poly=pts.map(p=>p.join(',')).join(' ');
  const labels=axes.map((a,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/n; const lr=R+14; return `<text x="${cx+lr*Math.cos(ang)}" y="${cy+lr*Math.sin(ang)}" text-anchor="middle" alignment-baseline="middle" font-size="9" fill="#64748b">${a[0]} ${a[1]}</text>`; }).join('');
  const grid=[0.25,0.5,0.75,1].map(f=>{ const gp=axes.map((_,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/n; const r=R*f; return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)].join(','); }).join(' '); return `<polygon points="${gp}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`; }).join('');
  return `<svg width="160" height="160">${grid}<polygon points="${poly}" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#2563eb"/>`).join('')}${labels}</svg>`;
}

        ${state.badcases.map(b=>{const s=skillById(b.skillId);const cm={high:['#dc2626','高'],medium:['#d97706','中'],low:['#64748b','低']}[b.confidence];
          return `<div class="border border-slate-200 rounded-md p-2.5 mb-2 fade-in">
            <div class="flex items-center gap-2"><span class="pill px-1.5 py-0 text-[10px]" style="background:#fee2e2;color:#991b1b">${b.type}</span><span class="text-[11px] text-slate-400">${s?.display||''}</span><span class="pill px-1.5 py-0 text-[10px] ml-auto" style="background:${cm[0]}1a;color:${cm[0]}">置信度 ${cm[1]}</span></div>
            <div class="text-[12px] text-slate-600 mt-1">${b.desc}</div>
            <div class="flex gap-2 mt-1.5"><button onclick="sedimentBadcase('${b.id}')" class="text-[11px] px-2 py-0.5 bg-brand-600 text-white rounded">沉淀为测试用例</button><button onclick="toast('已忽略')" class="text-[11px] px-2 py-0.5 text-slate-500">忽略</button></div>
          </div>`;}).join('')}
      </div>
    </div>
    <div class="card p-4 mt-3">
      <div class="font-medium mb-3">召回率看板 <span class="text-[11px] text-slate-400 font-normal">（description 优化目标）</span></div>
      ${state.skills.filter(s=>s.status!=='draft').map(s=>{const c=catByCode(s.group);const low=s.recall<0.7;return `<div class="flex items-center gap-2 py-1">
        ${dot(c.color)}<span class="w-36 truncate text-[12px]">${s.display}</span>
        <div class="flex-1 h-2 rounded bg-slate-100 overflow-hidden"><div class="bar-fill h-full" style="width:${Math.round(s.recall*100)}%;background:${low?'#dc2626':'#0891b2'}"></div></div>
        <span class="text-[11px] w-10 text-right" style="color:${low?'#dc2626':'#64748b'}">${Math.round(s.recall*100)}%</span>
        ${low?`<button onclick="toast('LLM 已生成 description 优化建议：补充触发词与负向边界')" class="text-[11px] px-2 py-0.5 bg-amber-100 text-amber-700 rounded">优化建议</button>`:'<span class="w-16"></span>'}
      </div>`;}).join('')}
    </div>`;
}
function sedimentBadcase(id){
  const b=state.badcases.find(x=>x.id===id); b.status='resolved';
  toast('已沉淀为测试用例（触发路由），下次测评将回归'); renderEval();
}

/* =========================================================
   ADMIN VIEW
   ========================================================= */
function renderAdmin(){
  $('#content').innerHTML=`
    <div class="card p-4 mb-3"><div class="font-medium">管理 · 分类体系</div><div class="text-[12px] text-slate-500">租户级两级分类（领域 + 细分）。新增技能未分类时进入“未分类”。</div></div>
    <div class="card p-4">
      ${state.categories.map((c,ci)=>`
        <div class="border border-slate-200 rounded-md p-3 mb-2">
          <div class="flex items-center gap-2">
            <input type="color" value="${c.color}" onchange="setCatColor(${ci},this.value)" class="w-6 h-6 rounded cursor-pointer" />
            <input value="${c.name}" onchange="setCatName(${ci},this.value)" class="px-2 py-1 border border-slate-300 rounded text-[13px] flex-1" />
            <button onclick="delCat(${ci})" class="text-[12px] text-red-500 hover:text-red-700">删除领域</button>
          </div>
          <div class="flex flex-wrap gap-1.5 mt-2 ml-8">
            ${c.areas.map((a,ai)=>`<span class="pill px-2 py-0.5 text-[11px] bg-slate-100 text-slate-600 flex items-center gap-1">${a}<button onclick="delArea(${ci},${ai})" class="text-slate-400 hover:text-red-500">✕</button></span>`).join('')}
            <button onclick="addArea(${ci})" class="pill px-2 py-0.5 text-[11px] border border-dashed border-slate-300 text-slate-500 hover:bg-slate-50">+ 细分</button>
          </div>
        </div>`).join('')}
      <button onclick="addCat()" class="px-3 py-1.5 border border-dashed border-slate-300 rounded-md text-[13px] text-slate-500 hover:bg-slate-50 w-full">+ 新增领域分组</button>
    </div>`;
}
function setCatColor(i,v){ state.categories[i].color=v; renderAdmin(); }
function setCatName(i,v){ state.categories[i].name=v; renderSubnav(); }
function delCat(i){ if(!confirm('删除该领域分组？'))return; state.categories.splice(i,1); renderAdmin(); renderSubnav(); }
function addCat(){ const code='g'+Date.now(); state.categories.push({code,name:'新领域',color:'#64748b',areas:[]}); renderAdmin(); renderSubnav(); }
function addArea(i){ const a=prompt('细分领域名称：'); if(a){state.categories[i].areas.push(a); renderAdmin();} }
function delArea(i,ai){ state.categories[i].areas.splice(ai,1); renderAdmin(); }

function openUploadSkill(){
  $('#modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="card w-[520px] fade-in">
      <div class="p-4 border-b border-slate-200 flex justify-between"><div class="font-medium">上传技能到 workspace</div><button onclick="closeModal()" class="text-slate-400">✕</button></div>
      <div class="p-4 space-y-3">
        <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center text-[12px] text-slate-500">
          <div class="text-2xl mb-1">📦</div>
          拖拽 <span class="font-mono">SKILL.md</span> 或技能文件夹到这里，或点击选择文件
          <div class="text-[11px] text-slate-400 mt-1">将写入 <span class="font-mono">.claude/skills/&lt;name&gt;/</span>，frontmatter 校验后导入为草稿</div>
        </div>
        <div class="text-[11px] text-slate-400">⚠ 上传技能不会自动发布到市场；如需共享请走「提 PR」流程。</div>
        <div class="bg-slate-50 rounded p-2 text-[12px] text-slate-600">已识别：name=pdf-extractor · description=… · 文件 4 · frontmatter ✓</div>
      </div>
      <div class="p-4 border-t border-slate-200 flex justify-end gap-2"><button onclick="closeModal()" class="px-3 py-1.5 border border-slate-300 rounded text-[13px]">取消</button><button onclick="doUpload()" class="px-3 py-1.5 bg-brand-600 text-white rounded text-[13px]">导入为草稿</button></div>
    </div></div>`;
}
function doUpload(){
  const ns={id:'up'+Date.now(), name:'uploaded-skill', display:'上传技能 (草稿)', summary:'从文件 tab 上传的技能', group:'common', area:'文档与写作', status:'draft', version:0, owner:state.currentUser, passRate:0, local:true, source:'uploaded', installed:false, enabled:false, pinned:false, isCompiled:false, recall:0,
    quality:{trigger:0,assembly:0,safety:0,quality:0,efficiency:0},
    desc:{summary:'从文件 tab 上传的技能', triggers:[], notFor:[], capabilities:[], keywords:[]} };
  state.skills.unshift(ns);
  closeModal(); toast('已导入为草稿：uploaded-skill');
  setView('mine');
  openDetail(ns.id);
}

/* =========================================================
   RENDER ROUTER
   ========================================================= */
function render(){
  if(state.view==='market') renderMarket();
  else if(state.view==='mine') renderMine();
  else if(state.view==='templates') renderTemplates();
  else if(state.view==='snippets') renderSnippets();
  else if(state.view==='prs') renderPRs();
  else if(state.view==='eval') renderEval();
  else if(state.view==='admin') renderAdmin();
}

/* init */
renderSubnav();
render();
</script>
</body>
</html>
