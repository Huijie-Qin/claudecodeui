<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataAgent × WorkBuddy · 交互原型</title>
  <style>
    :root {
      --app-bg: #ffffff;
      --sidebar-bg: #f5f5f3;
      --sidebar-hover: #ececea;
      --surface: #ffffff;
      --surface-subtle: #fafaf9;
      --surface-raised: #ffffff;
      --text: #232321;
      --text-2: #5f5e5a;
      --text-3: #8b8983;
      --line: #e5e4e0;
      --line-strong: #d4d2cc;
      --brand: #6757d8;
      --brand-hover: #5848c6;
      --brand-soft: #f1efff;
      --brand-line: #d9d4ff;
      --blue: #3478d4;
      --blue-soft: #edf5ff;
      --green: #23855b;
      --green-soft: #ecf8f2;
      --orange: #b86a1b;
      --orange-soft: #fff5e8;
      --red: #c44747;
      --red-soft: #fff0ef;
      --shadow-sm: 0 1px 2px rgba(26, 25, 23, .05);
      --shadow-md: 0 14px 36px rgba(35, 33, 28, .12), 0 2px 8px rgba(35, 33, 28, .05);
      --sidebar-width: 258px;
      --context-width: 344px;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 960px;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--text);
      font: 13px/1.48 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    button, input, textarea, select { outline: none; }
    :focus-visible { outline: 2px solid rgba(103, 87, 216, .55); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    svg { display: block; }
    ::selection { background: #ddd8ff; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d4d2cc; border: 2px solid transparent; border-radius: 9px; background-clip: padding-box; }

    .app-shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); height: 100vh; }
    .sidebar {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
    }
    .window-drag { height: 28px; flex: 0 0 auto; -webkit-app-region: drag; }
    .brand-row { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px 0 14px; }
    .brand-mark {
      display: grid; place-items: center; width: 24px; height: 24px; flex: none;
      border-radius: 7px; background: linear-gradient(145deg, #7b6bea, #5645c2); color: #fff;
      font-size: 12px; font-weight: 800; letter-spacing: -.03em; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    }
    .brand-name { min-width: 0; font-weight: 700; letter-spacing: -.01em; }
    .sidebar-nav { position: relative; padding: 8px 8px 4px; }
    .nav-button {
      display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px;
      border: 0; border-radius: 8px; background: transparent; color: #45443f; text-align: left;
    }
    .nav-button:hover { background: var(--sidebar-hover); }
    .nav-button.active { background: #e8e6e2; color: #1f1f1d; font-weight: 620; box-shadow: inset 0 0 0 1px rgba(0,0,0,.015); }
    .nav-button.primary .nav-icon { color: var(--brand); }
    .nav-icon { display: grid; place-items: center; width: 18px; height: 18px; color: #67655f; }
    .nav-icon svg { width: 17px; height: 17px; }
    .sidebar-divider { height: 1px; margin: 6px 12px; background: var(--line); }

    .space-section { min-height: 0; flex: 1; display: flex; flex-direction: column; padding: 4px 8px 0; }
    .section-label { display: flex; align-items: center; height: 30px; padding: 0 8px; color: var(--text-3); font-size: 11px; font-weight: 650; }
    .section-count { margin-left: 5px; font-weight: 500; }
    .section-action { margin-left: auto; display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); }
    .section-action:hover { background: var(--sidebar-hover); color: var(--text); }
    .project-list { min-height: 0; overflow-y: auto; padding-bottom: 8px; }
    .project-group { margin-bottom: 4px; }
    .project-row { display: flex; align-items: center; gap: 7px; width: 100%; height: 32px; padding: 0 7px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
    .project-row:hover { background: var(--sidebar-hover); }
    .project-chevron { width: 12px; color: var(--text-3); transition: transform .15s ease; }
    .project-group.collapsed .project-chevron { transform: rotate(-90deg); }
    .project-icon { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: #dedbd4; color: #5c5a55; font-size: 10px; font-weight: 750; }
    .project-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 12px; }
    .project-count { color: var(--text-3); font-size: 10px; }
    .task-list { margin: 1px 0 4px 25px; border-left: 1px solid #dedcd7; padding-left: 7px; }
    .project-group.collapsed .task-list { display: none; }
    .task-row { display: flex; align-items: center; gap: 7px; width: 100%; min-height: 30px; padding: 5px 7px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); text-align: left; }
    .task-row:hover { background: var(--sidebar-hover); color: var(--text); }
    .task-row.active { background: #e8e6e2; color: var(--text); }
    .status-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: #a8a69f; }
    .status-dot.running { background: var(--brand); box-shadow: 0 0 0 3px rgba(103,87,216,.1); animation: pulse 1.5s infinite; }
    .status-dot.completed { background: var(--green); }
    .status-dot.failed, .status-dot.denied, .status-dot.blocked { background: var(--red); }
    .status-dot.paused, .status-dot.cancelled, .status-dot.permission_required { background: var(--orange); }
    .task-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
    .task-time { color: var(--text-3); font-size: 9.5px; }
    @keyframes pulse { 50% { opacity: .45; } }

    .sidebar-footer { position: relative; padding: 6px 8px 9px; border-top: 1px solid var(--line); }
    .user-row { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px 2px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); text-align: left; }
    .user-row:hover { background: var(--sidebar-hover); }
    .user-avatar { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #dcd8f6; color: #4f43a8; font-weight: 700; font-size: 10px; }
    .user-meta { min-width: 0; flex: 1; }
    .user-name { color: var(--text); font-size: 11.5px; font-weight: 600; }
    .user-plan { color: var(--text-3); font-size: 9.5px; }
    .more-menu {
      position: absolute; left: 8px; top: calc(100% + 4px); bottom: auto; width: 242px; padding: 6px;
      border: 1px solid var(--line); border-radius: 11px; background: var(--surface-raised); box-shadow: var(--shadow-md); z-index: 80;
      animation: pop .14s ease-out;
    }
    .account-menu {
      position: absolute; left: 10px; bottom: 55px; width: 224px; padding: 6px;
      border: 1px solid var(--line); border-radius: 11px; background: var(--surface-raised); box-shadow: var(--shadow-md); z-index: 82;
      animation: pop .14s ease-out;
    }
    .account-summary { padding: 9px; }
    .account-summary strong { display: block; font-size: 11.5px; }
    .account-summary span { display: block; margin-top: 2px; color: var(--text-3); font-size: 9.5px; }
    .tenant-option { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 42px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 9px; background: #fff; text-align: left; }
    .tenant-option + .tenant-option { margin-top: 7px; }
    .tenant-option:hover { border-color: var(--line-strong); background: var(--surface-subtle); }
    .tenant-option.active { border-color: var(--brand-line); background: var(--brand-soft); }
    .tenant-mark { display: grid; place-items: center; width: 26px; height: 26px; flex: none; border-radius: 7px; background: #e5e2dc; color: #5d5a53; font-size: 10px; font-weight: 750; }
    .tenant-option-copy { min-width: 0; flex: 1; }
    .tenant-option-copy strong { display: block; font-size: 11px; }
    .tenant-option-copy span { display: block; color: var(--text-3); font-size: 9.5px; }
    .menu-label { padding: 7px 9px 4px; color: var(--text-3); font-size: 10px; font-weight: 650; }
    .menu-item { display: flex; align-items: center; gap: 9px; width: 100%; height: 33px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
    .menu-item:hover { background: var(--surface-subtle); }
    .menu-item .sub { margin-left: auto; color: var(--text-3); font-size: 10px; }
    .menu-separator { height: 1px; margin: 5px 3px; background: var(--line); }

    .main-shell { position: relative; min-width: 0; height: 100vh; overflow: hidden; background: var(--surface); }
    .page-view { height: 100%; min-width: 0; }
    .page-header {
      display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 20px;
      border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    }
    .header-title { min-width: 0; font-weight: 680; letter-spacing: -.01em; }
    .header-subtitle { color: var(--text-3); font-size: 11px; }
    .header-separator { width: 1px; height: 18px; background: var(--line); }
    .header-actions { display: flex; align-items: center; gap: 7px; margin-left: auto; }
    .icon-button { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-2); }
    .icon-button:hover { border-color: var(--line); background: var(--surface-subtle); color: var(--text); }
    .icon-button svg { width: 16px; height: 16px; }
    .small-button, .secondary-button, .primary-button, .danger-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 32px; padding: 0 11px;
      border-radius: 8px; font-weight: 620; white-space: nowrap;
    }
    .small-button { min-height: 28px; padding: 0 9px; border: 1px solid var(--line); background: #fff; font-size: 11.5px; }
    .small-button:hover, .secondary-button:hover { border-color: var(--line-strong); background: var(--surface-subtle); }
    .secondary-button { border: 1px solid var(--line); background: #fff; }
    .primary-button { border: 1px solid var(--brand); background: var(--brand); color: #fff; box-shadow: var(--shadow-sm); }
    .primary-button:hover { border-color: var(--brand-hover); background: var(--brand-hover); }
    .danger-button { border: 1px solid #e1b5b2; background: #fff; color: var(--red); }
    .danger-button:hover { background: var(--red-soft); }
    .button-icon svg { width: 14px; height: 14px; }
    .context-trigger { display: none; }

    /* New task */
    .new-page { display: flex; flex-direction: column; height: 100%; background: linear-gradient(180deg, #fbfaf8 0, #fff 180px); }
    .new-content { min-height: 0; flex: 1; overflow-y: auto; padding: 48px 34px 60px; }
    .new-inner { width: min(820px, 100%); margin: 0 auto; }
    .new-greeting { margin-bottom: 24px; text-align: center; }
    .new-greeting-mark { display: grid; place-items: center; width: 36px; height: 36px; margin: 0 auto 13px; border-radius: 11px; background: var(--brand-soft); color: var(--brand); }
    .new-greeting h1 { font-size: 25px; line-height: 1.25; letter-spacing: -.035em; font-weight: 690; }
    .new-greeting p { margin-top: 7px; color: var(--text-3); }
    .composer-card { position: relative; border: 1px solid var(--line-strong); border-radius: 16px; background: #fff; box-shadow: 0 8px 28px rgba(39,36,28,.07); overflow: visible; transition: border-color .15s, box-shadow .15s; }
    .composer-card:focus-within { border-color: #aea6ef; box-shadow: 0 8px 30px rgba(63,52,146,.10), 0 0 0 3px rgba(103,87,216,.07); }
    .composer-input { width: 100%; min-height: 126px; resize: none; padding: 18px 19px 8px; border: 0; background: transparent; line-height: 1.65; font-size: 14px; }
    .composer-input::placeholder { color: #aaa8a3; }
    .capability-strip { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 14px 7px; min-height: 31px; }
    .cap-chip { display: inline-flex; align-items: center; gap: 5px; height: 25px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-subtle); color: var(--text-2); font-size: 11px; }
    .cap-chip.selected { border-color: var(--brand-line); background: var(--brand-soft); color: #5042b0; }
    .cap-chip .remove { color: #827ba8; font-size: 14px; line-height: 1; }
    .composer-footer { position: relative; display: flex; align-items: center; gap: 6px; padding: 9px 11px 11px; }
    .round-action { display: grid; place-items: center; width: 31px; height: 31px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); }
    .round-action:hover { background: var(--surface-subtle); color: var(--text); }
    .round-action svg { width: 16px; height: 16px; }
    .skill-command-control { position: relative; flex: none; }
    .skill-command-button { position: relative; }
    .command-count {
      position: absolute; top: -5px; right: -5px; display: grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px;
      border: 2px solid #fff; border-radius: 999px; background: var(--brand); color: #fff; font-size: 8.5px; font-weight: 760; line-height: 1;
    }
    .skill-command-menu {
      position: absolute; z-index: 96; left: 0; bottom: calc(100% + 9px); width: 360px; max-height: 300px; overflow: hidden;
      border: 1px solid var(--line); border-radius: 11px; background: #fff; box-shadow: var(--shadow-md); animation: pop .14s ease-out;
    }
    .skill-command-head { display: flex; align-items: center; gap: 8px; padding: 11px 12px 9px; border-bottom: 1px solid var(--line); }
    .skill-command-head strong { font-size: 11px; }
    .skill-command-head span { margin-left: auto; color: var(--text-3); font-size: 9.5px; }
    .skill-command-list { max-height: 226px; overflow-y: auto; padding: 6px; }
    .skill-command-item { display: flex; align-items: flex-start; gap: 9px; width: 100%; padding: 8px 9px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
    .skill-command-item:hover { background: var(--brand-soft); }
    .skill-command-symbol { display: grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 7px; background: var(--surface-subtle); color: var(--brand); }
    .skill-command-copy { min-width: 0; flex: 1; }
    .skill-command-copy strong { display: block; font: 10.5px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .skill-command-copy span { display: block; margin-top: 3px; overflow: hidden; color: var(--text-3); font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }
    .skill-command-footer { padding: 7px; border-top: 1px solid var(--line); background: var(--surface-subtle); }
    .skill-command-footer button { width: 100%; }
    .send-button { display: grid; place-items: center; width: 33px; height: 33px; margin-left: auto; border: 0; border-radius: 9px; background: var(--brand); color: #fff; }
    .send-button:hover { background: var(--brand-hover); }
    .send-button svg { width: 16px; height: 16px; }
    .workspace-picker-wrap { position: relative; }
    .workspace-picker {
      display: inline-flex; align-items: center; gap: 7px; height: 32px; max-width: 260px; padding: 0 9px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text-2); text-align: left;
    }
    .workspace-picker:hover, .workspace-picker.open { border-color: #bbb6df; background: #fdfcff; }
    .workspace-picker .workspace-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 620; }
    .workspace-picker .workspace-prefix { color: var(--text-3); font-size: 10px; }
    .workspace-picker svg { width: 14px; height: 14px; flex: none; }
    .workspace-menu {
      position: absolute; z-index: 95; top: calc(100% + 6px); left: 0; width: 276px; padding: 6px;
      border: 1px solid var(--line); border-radius: 11px; background: #fff; box-shadow: var(--shadow-md); animation: pop .14s ease-out;
    }
    .workspace-picker-wrap.header .workspace-menu { right: 0; left: auto; }
    .workspace-picker-wrap.composer .workspace-menu { top: auto; bottom: calc(100% + 6px); }
    .workspace-option { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 43px; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
    .workspace-option:hover { background: var(--surface-subtle); }
    .workspace-option.active { background: var(--brand-soft); }
    .workspace-option .project-icon { width: 24px; height: 24px; }
    .workspace-option-copy { min-width: 0; flex: 1; }
    .workspace-option-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .workspace-option-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); font-size: 9.5px; }
    .config-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .config-field { position: relative; }
    .config-field label { display: block; margin: 0 0 5px 2px; color: var(--text-3); font-size: 10.5px; font-weight: 620; }
    .select-like { display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .select-like:hover { border-color: var(--line-strong); }
    select.select-like { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #8b8983 50%), linear-gradient(135deg, #8b8983 50%, transparent 50%); background-position: calc(100% - 15px) 17px, calc(100% - 11px) 17px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
    .field-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
    /* Task */
    .task-page { display: flex; flex-direction: column; height: 100%; }
    .task-layout { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(520px, 1fr) var(--context-width); }
    .conversation { min-width: 0; display: flex; flex-direction: column; height: 100%; background: #fff; }
    .messages { min-height: 0; flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .messages-inner { width: min(760px, calc(100% - 44px)); margin: 0 auto; padding: 26px 0 38px; }
    .message { margin-bottom: 21px; }
    .message-user { display: flex; justify-content: flex-end; }
    .user-bubble { max-width: 78%; padding: 10px 13px; border-radius: 13px 13px 4px 13px; background: #f0efec; line-height: 1.58; }
    .assistant-message { display: grid; grid-template-columns: 25px minmax(0, 1fr); gap: 10px; }
    .assistant-avatar { display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; border-radius: 7px; background: var(--brand-soft); color: var(--brand); font-size: 10px; font-weight: 800; }
    .assistant-content { min-width: 0; padding-top: 2px; }
    .assistant-content p { margin-bottom: 8px; line-height: 1.68; }
    .assistant-content p:last-child { margin-bottom: 0; }
    .thinking-block, .tool-block, .subagent-block { margin: 9px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-subtle); overflow: hidden; }
    .block-header { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px; padding: 7px 10px; border: 0; background: transparent; text-align: left; }
    .block-header:hover { background: #f5f4f1; }
    .block-icon { color: var(--text-3); }
    .block-icon svg { width: 15px; height: 15px; }
    .block-title { font-weight: 620; font-size: 11.5px; }
    .block-meta { margin-left: auto; color: var(--text-3); font-size: 10px; }
    .block-chevron { color: var(--text-3); transition: transform .15s; }
    .expanded .block-chevron { transform: rotate(180deg); }
    .block-body { display: none; padding: 0 11px 10px 33px; color: var(--text-2); font-size: 11.5px; white-space: pre-wrap; }
    .expanded .block-body { display: block; }
    .tool-status { display: inline-flex; align-items: center; gap: 4px; color: var(--green); }
    .tool-status.running { color: var(--brand); }
    .tool-code { margin-top: 7px; padding: 9px 10px; overflow: auto; border: 1px solid #e2e1dd; border-radius: 7px; background: #fff; color: #474640; font: 10.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .permission-card { margin: 10px 0; overflow: hidden; border: 1px solid #e8d5b4; border-radius: 11px; background: #fffdfa; }
    .permission-top { display: flex; align-items: flex-start; gap: 10px; padding: 12px; }
    .permission-icon { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--orange-soft); color: var(--orange); }
    .permission-icon svg { width: 15px; height: 15px; }
    .permission-title { margin: 1px 0 3px; font-weight: 670; }
    .permission-desc { color: var(--text-2); font-size: 11px; }
    .permission-command { margin: 0 12px 11px; padding: 9px 10px; border-radius: 7px; background: #f5f3ef; color: #4c4a45; font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .permission-actions { display: flex; justify-content: flex-end; gap: 7px; padding: 9px 11px; border-top: 1px solid #eee3d2; background: #fffaf3; }
    .permission-decision { padding: 8px 12px 10px; border-top: 1px solid #eee3d2; color: var(--text-2); font-size: 11px; }
    .result-card { margin-top: 10px; padding: 14px; border: 1px solid #cfe5da; border-radius: 11px; background: #fbfffd; }

    (() => {

        settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>',

        brain: '<path d="M9.5 4.2A3.5 3.5 0 0 0 6 7.7v.2A3.5 3.5 0 0 0 4 11a3.5 3.5 0 0 0 2 3.1v.2a3.5 3.5 0 0 0 3.5 3.5c1 0 1.8-.4 2.5-1V5.2a3.4 3.4 0 0 0-2.5-1Zm5 0A3.5 3.5 0 0 1 18 7.7v.2a3.5 3.5 0 0 1 2 3.1 3.5 3.5 0 0 1-2 3.1v.2a3.5 3.5 0 0 1-3.5 3.5c-1 0-1.8-.4-2.5-1V5.2a3.4 3.4 0 0 1 2.5-1Z"/>',
        message: '<path d="M20 15a4 4 0 0 1-4 4H9l-5 3v-4.7A4 4 0 0 1 3 15V8a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4v7Z"/>',
        terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m5 0h5"/>',

        review: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4M8 10.5l1.7 1.7L13 9"/>',
        bug: '<path d="m8 2 1.5 2h5L16 2m-4 5v12m-7-7H2m20 0h-3M6 7 3 5m15 2 3-2M6 17l-3 2m15-2 3 2"/><rect x="6" y="4" width="12" height="16" rx="6"/>',
        plug: '<path d="M8 12h8m-6-8v5m4-5v5m3 0v3a5 5 0 0 1-10 0V9h10Zm-5 8v4"/>',
        play: '<path d="m8 5 11 7-11 7V5Z"/>',
        edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"/>',
        external: '<path d="M14 4h6v6m0-6-9 9"/><path d="M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/>',

        branch: '<circle cx="6" cy="5" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10m2-4c5 0 8-2 8-4"/>',
        menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
        reset: '<path d="M4 4v6h6M20 20v-6h-6"/><path d="M6.5 17.5A8 8 0 0 0 19 14M5 10a8 8 0 0 1 12.5-3.5"/>',
        command: '<path d="M9 6H6a3 3 0 1 0 3 3V6Zm6 0h3a3 3 0 1 1-3 3V6ZM9 18H6a3 3 0 1 1 3-3v3Zm6 0h3a3 3 0 1 0-3-3v3ZM9 6h6v12H9V6Z"/>'
      };
      function icon(name, size = 16) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.info}</svg>`;
      }

      function currentRoute() {
        const hash = location.hash || '#/new';
        const parts = hash.replace(/^#\//, '').split('/');
        if (parts[0] === 'task') return { page: 'task', id: parts[1] };
        if (parts[0] === 'capabilities') return { page: 'capabilities', tab: parts[1] || 'experts' };
        if (parts[0] === 'automation') return { page: 'automation' };
        if (parts[0] === 'files') return { page: 'files' };
        return { page: 'new' };
      }
      function navigate(hash) {
        ui.moreOpen = false;
        ui.accountMenuOpen = false;
        ui.workspaceMenu = null;
        ui.commandMenuScope = null;
        ui.contextOpen = false;
        if (location.hash === hash) render();
        else location.hash = hash;
      }

      function render() {
        if (ui.loggedOut) {
          document.getElementById('app').innerHTML = loginTemplate();
          return;
        }
        const route = currentRoute();
        document.getElementById('app').innerHTML = `<div class="app-shell">${sidebarTemplate(route)}<main class="main-shell" id="main-view">${pageTemplate(route)}</main></div>`;
        bindPostRender(route);
      }

      function renderSidebar() {
        const route = currentRoute();
        const current = document.querySelector('.sidebar');
        if (!current) return render();
        current.outerHTML = sidebarTemplate(route);
      }

      function sidebarTemplate(route) {
        return `
          <aside class="sidebar" aria-label="主导航">
            <div class="window-drag"></div>
            <div class="brand-row"><div class="brand-mark">D</div><div class="brand-name">DataAgent</div></div>
            <nav class="sidebar-nav">
              ${navButton('new', '新建任务', 'plus', route.page === 'new')}
              ${navButton('capabilities', '专家 · 技能 · 连接器', 'spark', route.page === 'capabilities')}
              ${navButton('automation', '自动化', 'automation', route.page === 'automation')}
              ${navButton('files', '文件', 'file', route.page === 'files')}
              <button class="nav-button ${ui.moreOpen ? 'active' : ''}" data-action="toggle-more"><span class="nav-icon">${icon('more')}</span><span>更多</span></button>
              ${ui.moreOpen ? moreMenuTemplate() : ''}
            </nav>
            <div class="sidebar-divider"></div>
            <section class="space-section">
              <div class="section-label">空间 <span class="section-count">${projects.length}</span><button class="section-action" data-action="project-info" aria-label="项目说明">${icon('info', 13)}</button></div>
              <div class="project-list">
                ${projects.map(project => projectGroupTemplate(project, route)).join('')}
              </div>
            </section>
            <footer class="sidebar-footer">
              ${ui.accountMenuOpen ? accountMenuTemplate() : ''}
              <button class="nav-button" data-action="open-settings"><span class="nav-icon">${icon('settings')}</span><span>设置</span></button>
              <button class="user-row" data-action="toggle-account-menu"><div class="user-avatar">SO</div><div class="user-meta"><div class="user-name">song</div><div class="user-plan">${escapeHtml(tenantById(state.currentTenant).name)} · 已连接</div></div>${icon('chevron',12)}</button>
            </footer>
          </aside>`;
      }
      function navButton(page, label, iconName, active) {
        const hash = page === 'capabilities' ? '#/capabilities/experts' : page === 'automation' ? '#/automation' : page === 'files' ? '#/files' : '#/new';
        return `<button class="nav-button ${page === 'new' ? 'primary' : ''} ${active ? 'active' : ''}" data-nav="${hash}"><span class="nav-icon">${icon(iconName)}</span><span>${label}</span></button>`;
      }
      function projectGroupTemplate(project, route) {
        const tasks = state.tasks.filter(t => t.projectId === project.id).slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        const collapsed = state.collapsedProjects.includes(project.id);
        return `<div class="project-group ${collapsed ? 'collapsed' : ''}">
          <button class="project-row" data-action="toggle-project" data-id="${project.id}" title="${escapeHtml(project.path)}">
            <span class="project-chevron">${icon('chevron', 12)}</span><span class="project-icon">${project.letter}</span><span class="project-name">${escapeHtml(project.name)}</span><span class="project-count">${tasks.length}</span>
          </button>
          <div class="task-list">
            ${tasks.length ? tasks.map(task => `<button class="task-row ${route.page === 'task' && route.id === task.id ? 'active' : ''}" data-nav="#/task/${task.id}" title="${escapeHtml(task.title)}"><span class="status-dot ${statusDotClass(task.status)}"></span><span class="task-title">${escapeHtml(task.title)}</span><span class="task-time">${escapeHtml(task.updatedAt)}</span></button>`).join('') : `<div class="task-row"><span class="task-title" style="color:var(--text-3)">暂无任务</span></div>`}
          </div>
        </div>`;
      }
      function moreMenuTemplate() {
        return `<div class="more-menu" role="menu">
          <div class="menu-label">项目工具</div>
          ${menuItem('codehub', 'CodeHub', 'branch', 'Git')}
          ${menuItem('sql', 'SQL Check', 'database', '检查')}
          <div class="menu-separator"></div>
          <div class="menu-label">管理</div>
          ${menuItem('admin', '管理后台', 'shield')}
        </div>`;
      }
      function menuItem(id, label, iconName, sub = '') { return `<button class="menu-item" data-action="more-entry" data-id="${id}">${icon(iconName,14)}<span>${label}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</button>`; }
      function accountMenuTemplate() {
        const tenant = tenantById(state.currentTenant);
        return `<div class="account-menu" role="menu"><div class="account-summary"><strong>song</strong><span>${escapeHtml(tenant.name)} · ${escapeHtml(tenant.role)}</span></div><div class="menu-separator"></div><button class="menu-item" data-action="open-settings">${icon('settings',14)}<span>账号与租户设置</span></button><button class="menu-item" data-action="logout">${icon('external',14)}<span>退出登录</span></button></div>`;
      }
      function loginTemplate() {
        return `<main class="login-screen"><section class="login-panel"><div class="brand-mark">D</div><h1>已退出 DataAgent</h1><p>本地演示数据仍保留在当前浏览器中。</p><button class="primary-button" data-action="login-demo">使用演示账号登录</button></section></main>`;
      }
      function workspacePickerTemplate(scope, projectId = state.selectedProject) {
        const project = projectById(projectId);
        const open = ui.workspaceMenu === scope;
        return `<div class="workspace-picker-wrap ${scope === 'new' ? 'composer' : 'header'}"><button class="workspace-picker ${open ? 'open' : ''}" data-action="toggle-workspace-menu" data-scope="${scope}" aria-expanded="${open}">${icon('folder')}<span class="workspace-prefix">工作区</span><span class="workspace-name">${escapeHtml(project.name)}</span>${icon('chevron',11)}</button>${open ? `<div class="workspace-menu" role="menu"><div class="menu-label">选择工作区</div>${projects.map(item => `<button class="workspace-option ${item.id === project.id ? 'active' : ''}" data-action="select-workspace" data-id="${item.id}"><span class="project-icon">${item.letter}</span><span class="workspace-option-copy"><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.path)}</span></span>${item.id === project.id ? icon('check',13) : ''}</button>`).join('')}</div>` : ''}</div>`;
      }
      function workspaceSkillCommands(projectId) {
        const enabledIds = new Set(workspaceCaps(projectId).skills || []);
        return state.skills.filter(skill => enabledIds.has(skill.id));
      }
      function skillCommandControlTemplate(scope, projectId, inputId, disabled = false, taskId = '') {
        const skills = workspaceSkillCommands(projectId);
        const open = ui.commandMenuScope === scope;
        return `<div class="skill-command-control"><button class="round-action skill-command-button" data-action="toggle-skill-command-menu" data-scope="${escapeHtml(scope)}" aria-label="技能命令，${skills.length} 个可用" aria-expanded="${open}" ${disabled ? 'disabled' : ''}>${icon('message')}${skills.length ? `<span class="command-count">${skills.length}</span>` : ''}</button>${open ? skillCommandMenuTemplate(skills, projectId, inputId, taskId) : ''}</div>`;
      }
      function skillCommandMenuTemplate(skills, projectId, inputId, taskId = '') {
        return `<div class="skill-command-menu" role="listbox" aria-label="选择技能命令"><div class="skill-command-head"><strong>当前工作区技能</strong><span>${escapeHtml(projectById(projectId).name)} · ${skills.length} 个</span></div><div class="skill-command-list">${skills.length ? skills.map(skill => `<button class="skill-command-item" role="option" data-action="insert-skill-command" data-code="${escapeHtml(skill.code)}" data-input="${escapeHtml(inputId)}" data-task="${escapeHtml(taskId)}"><span class="skill-command-symbol">${icon('spark',13)}</span><span class="skill-command-copy"><strong>/${escapeHtml(skill.code)}</strong><span>${escapeHtml(skill.name)} · ${escapeHtml(skill.description)}</span></span></button>`).join('') : `<div class="file-empty" style="min-height:120px">当前工作区没有已启用技能</div>`}</div><div class="skill-command-footer"><button class="small-button" data-nav="#/capabilities/skills">管理工作区技能</button></div></div>`;
      }

      function pageTemplate(route) {
        if (route.page === 'task') return taskPageTemplate(route.id);
        if (route.page === 'capabilities') return capabilitiesPageTemplate(route.tab);
        if (route.page === 'automation') return automationPageTemplate();
        if (route.page === 'files') return filesPageTemplate();
        return newTaskPageTemplate();
      }

      function newTaskPageTemplate() {
        return `<section class="page-view new-page">
          <header class="page-header"><div class="header-title">新建任务</div><div class="header-subtitle">在当前工作区开始一个 AI 会话</div></header>
          <div class="new-content"><div class="new-inner">
            <div class="new-greeting"><div class="new-greeting-mark">${icon('spark',19)}</div><h1>今天想完成什么？</h1><p>描述目标，DataAgent 会在所选工作区中规划并执行。</p></div>
            <div class="composer-card">
              <textarea class="composer-input" id="new-prompt" aria-label="任务描述" placeholder="例如：评审当前分支的登录模块改动，并给出可执行的修复建议…">${escapeHtml(ui.newPrompt)}</textarea>
              <div class="capability-strip" id="selected-capabilities">
                ${ui.selectedCapabilities.map(c => `<button class="cap-chip selected" data-action="remove-capability" data-name="${escapeHtml(c)}">${capabilityKindIcon(c)}<span>${escapeHtml(c)}</span><span class="remove">×</span></button>`).join('')}
                <button class="cap-chip" data-action="choose-capability">${icon('plus',12)} 添加能力</button>
              </div>
              <div class="composer-footer">
                ${skillCommandControlTemplate('new', state.selectedProject, 'new-prompt')}
                ${workspacePickerTemplate('new')}
                <button class="round-action" data-action="new-automation" aria-label="创建定时任务">${icon('clock')}</button>
                <button class="send-button" data-action="create-task" aria-label="开始任务">${icon('send')}</button>
              </div>
            </div>
          </div></div>
        </section>`;
      }
      function capabilityKindIcon(name) {
        if (/专家/.test(name)) return icon('users', 11);
        if (/GitHub|Filesystem|PostgreSQL|Browser|Slack|MCP/.test(name)) return icon('plug', 11);
        return icon('spark', 11);
      }
      function taskPageTemplate(id) {
        const task = taskById(id);
        if (!task) return notFoundTemplate();
        const project = projectById(task.projectId);
        return `<section class="page-view task-page">
          <header class="page-header">
            <div><div class="header-title">${escapeHtml(task.title)}</div><div class="header-subtitle">${escapeHtml(project.name)} · ${escapeHtml(task.provider)} / ${escapeHtml(task.model)}</div></div>
            <span class="state-badge ${task.status}">${taskStatusIcon(task.status)}${STATUS_LABEL[task.status] || task.status}</span>
            <div class="header-actions">
              <button class="icon-button" data-action="task-more" aria-label="任务菜单">${icon('more')}</button>
              <button class="icon-button context-trigger" data-action="toggle-context" aria-label="打开任务上下文">${icon('menu')}</button>
            </div>
          </header>
          <div class="task-layout">
            <section class="conversation">
              <div class="messages" id="messages"><div class="messages-inner">
                ${taskBannerTemplate(task)}
                ${task.messages.map((m, i) => messageTemplate(m, task, i)).join('')}
                ${isTaskRunning(task.status) ? streamingIndicatorTemplate(task.status) : ''}
              </div></div>
              ${taskComposerTemplate(task)}
            </section>
            ${contextPanelTemplate(task)}
            <div class="scrim ${ui.contextOpen ? 'open' : ''}" data-action="close-context"></div>
          </div>
        </section>`;
      }
      function taskStatusIcon(status) {
        if (status === 'completed') return icon('check', 11);
        if (status === 'failed' || status === 'denied' || status === 'blocked') return icon('x', 11);
        if (status === 'paused' || status === 'cancelled' || status === 'permission_required') return icon('clock', 11);
        return icon('spark', 11);
      }
      function taskBannerTemplate(task) {
        if (!['failed','denied','blocked','cancelled'].includes(task.status)) return '';
        const copy = {
          failed: ['任务执行失败', task.error || '工具调用发生错误，你可以补充信息后重试。'],
          denied: ['操作已拒绝', '任务停在需要权限的步骤。你可以继续任务并选择其他执行方式。'],
          blocked: ['任务已阻止', '当前权限或项目状态无法继续执行。'],
          cancelled: ['任务已停止', '已保留当前上下文，可以随时继续。']
        }[task.status];
        return `<div class="status-banner ${task.status}">${taskStatusIcon(task.status)}<div class="banner-text"><strong>${copy[0]}</strong><span>${escapeHtml(copy[1])}</span></div><button class="small-button" data-action="retry-task" data-id="${task.id}">${task.status === 'failed' ? '重试' : '继续任务'}</button></div>`;
      }
      function messageTemplate(message, task, index) {
        if (message.type === 'user') return `<div class="message message-user"><div class="user-bubble">${escapeHtml(message.text).replace(/\n/g,'<br>')}</div></div>`;
        if (message.type === 'thinking') return `<div class="message assistant-message"><div class="assistant-avatar">D</div><div class="assistant-content"><div class="thinking-block ${message.expanded ? 'expanded' : ''}"><button class="block-header" data-action="toggle-block" data-index="${index}"><span class="block-icon">${icon('brain')}</span><span class="block-title">${escapeHtml(message.title)}</span><span class="block-meta">思考过程</span><span class="block-chevron">${icon('chevron',12)}</span></button><div class="block-body">${escapeHtml(message.body)}</div></div></div></div>`;
        if (message.type === 'tool') return `<div class="message assistant-message"><div class="assistant-avatar">D</div><div class="assistant-content"><div class="tool-block ${message.expanded ? 'expanded' : ''}"><button class="block-header" data-action="toggle-block" data-index="${index}"><span class="block-icon">${icon('terminal')}</span><span class="block-title">${escapeHtml(message.name)}</span><span class="block-meta"><span class="tool-status ${message.status === 'running' ? 'running' : ''}">${message.status === 'running' ? '<i class="status-dot running"></i>执行中' : message.status === 'failed' ? '执行失败' : icon('check',10) + escapeHtml(message.meta)}</span></span><span class="block-chevron">${icon('chevron',12)}</span></button><div class="block-body"><div class="tool-code">${escapeHtml(message.detail)}</div></div></div></div></div>`;
        if (message.type === 'permission') return `<div class="message assistant-message"><div class="assistant-avatar">D</div><div class="assistant-content"><div class="permission-card"><div class="permission-top"><div class="permission-icon">${icon('shield')}</div><div><div class="permission-title">${escapeHtml(message.title)}</div><div class="permission-desc">${escapeHtml(message.description)}</div></div></div><div class="permission-command">${escapeHtml(message.command)}</div>${message.decision ? `<div class="permission-decision">${message.decision === 'deny' ? '你已拒绝此操作' : message.decision === 'remember' ? '已允许，并记住同类操作' : message.decision === 'cancelled' ? '任务已停止，此权限请求不再生效' : '已允许本次操作'}</div>` : `<div class="permission-actions"><button class="small-button" data-action="permission" data-choice="deny" data-task="${task.id}">拒绝</button><button class="secondary-button" data-action="permission" data-choice="once" data-task="${task.id}">允许一次</button><button class="primary-button" data-action="permission" data-choice="remember" data-task="${task.id}">允许并记住</button></div>`}</div></div></div>`;
        if (message.type === 'subagent') return `<div class="message assistant-message"><div class="assistant-avatar">D</div><div class="assistant-content"><div class="subagent-block expanded"><div class="block-header"><span class="block-icon">${icon('users')}</span><span class="block-title">${escapeHtml(message.name)}</span><span class="block-meta">${escapeHtml(message.meta || '子代理')}</span></div><div class="block-body" style="display:block">${escapeHtml(message.detail)}</div></div></div></div>`;
        if (message.type === 'result') return `<div class="message assistant-message"><div class="assistant-avatar">D</div><div class="assistant-content"><p>${escapeHtml(message.text)}</p><div class="result-card"><div class="result-title">${icon('check')} ${escapeHtml(message.title)}</div>${message.bullets ? `<ul>${message.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join('')}</ul>` : ''}</div></div></div>`;

      function createTaskFromComposer() {
        const prompt = (document.getElementById('new-prompt')?.value || ui.newPrompt).trim();
        if (!prompt) { showToast('请先描述要完成的任务', 'error'); document.getElementById('new-prompt')?.focus(); return; }
        const projectId = state.selectedProject;
        const providerValue = 'claude:sonnet-4.5';
        const permissionMode = 'standard';
        const providerMap = {
          'claude:sonnet-4.5': ['Claude','Sonnet 4.5'], 'codex:gpt-5.3-codex': ['Codex','GPT-5.3-Codex'],
          'cursor:agent': ['Cursor','Agent'], 'gemini:2.5-pro': ['Gemini','Gemini 2.5 Pro']
        };
        const [provider, model] = providerMap[providerValue] || providerMap['claude:sonnet-4.5'];
        const expert = ui.selectedCapabilities.find(c => c.includes('专家')) || '未选择';
        const task = {
          id: uid('task'), projectId, title: prompt.length > 22 ? prompt.slice(0, 22) + '…' : prompt, status: 'draft', updatedAt: nowTime(), provider, model, permissionMode, expert, prompt,
          messages: [{ type: 'user', text: prompt }],
          timeline: [{ label: '读取任务上下文', detail: '等待开始', live: true }, { label: '分析并制定步骤', detail: '尚未开始' }, { label: '执行工具', detail: '尚未开始' }, { label: '生成结果', detail: '尚未开始' }],
          agents: [{ name: '上下文分析', status: 'waiting', progress: 0, detail: '等待开始' }], files: [], artifacts: []
        };
        state.tasks.unshift(task);
        state.selectedProject = projectId; state.provider = providerValue; state.permissionMode = permissionMode;
        ui.newPrompt = '';
        saveState(); navigate('#/task/' + task.id); startTask(task.id);
      }

      function clearTaskTimer(id) { if (ui.timers[id]) { clearTimeout(ui.timers[id]); delete ui.timers[id]; } }
      function schedule(id, fn, delay) { clearTaskTimer(id); ui.timers[id] = setTimeout(() => { delete ui.timers[id]; fn(); }, delay); }
      function startTask(id, retry = false) {
        const task = taskById(id); if (!task) return;
        clearTaskTimer(id);
        task.status = 'preparing'; task.updatedAt = nowTime(); task.error = null;
        if (retry) {
          task.messages.push({ type: 'user', text: '已补充缺失信息，请重新执行。' });
          task.messages.push({ type: 'thinking', title: '重新规划执行路径', body: '将跳过缺失的 schema 文件，直接从路由与类型定义生成文档。', expanded: true });
        }
        task.timeline = [{ label: '读取任务上下文', detail: '进行中', live: true }, { label: '分析并制定步骤', detail: '尚未开始' }, { label: '执行工具', detail: '尚未开始' }, { label: '生成结果', detail: '尚未开始' }];
        task.agents = [{ name: '上下文分析', status: 'running', progress: 18, detail: '扫描项目' }];
        commit();
        schedule(id, () => enterReasoning(id, retry), 900);
      }
      function enterReasoning(id, retry) {
        const task = taskById(id); if (!task || task.status === 'cancelled') return;
        task.status = 'reasoning';
        task.timeline[0] = { label: '读取任务上下文', detail: '完成', done: true };
        task.timeline[1] = { label: '分析并制定步骤', detail: '进行中', live: true };
        task.agents[0] = { name: '上下文分析', status: 'completed', progress: 100, detail: '项目扫描完成' };
        if (!retry) task.messages.push({ type: 'thinking', title: '分析任务并制定步骤', body: '已读取项目结构和当前分支信息。下一步将搜索相关文件、执行只读检查，再汇总结论。', expanded: false });
        commit();
        schedule(id, () => requestTaskPermission(id), 1250);
      }
      function requestTaskPermission(id) {
        const task = taskById(id); if (!task || task.status === 'cancelled') return;
        if (state.rememberedPermissions || task.permissionMode === 'read' || task.permissionMode === 'plan') return beginTools(id, task.permissionMode === 'plan');
        task.status = 'permission_required';
        task.timeline[1] = { label: '分析并制定步骤', detail: '完成', done: true };
        task.timeline[2] = { label: '执行只读检查', detail: '等待权限', live: true };
        task.messages.push({ type: 'permission', id: uid('perm'), title: '允许读取项目文件和 Git 状态？', description: '这些操作只读取当前项目，不会修改文件。', command: 'rg --files && git diff --stat && git status --short', decision: null });
        commit();
      }
      function beginTools(id, planOnly = false) {
        const task = taskById(id); if (!task || task.status === 'cancelled') return;
        task.status = 'tool_running';
        task.timeline[1] = { label: '分析并制定步骤', detail: '完成', done: true };
        task.timeline[2] = { label: planOnly ? '生成执行计划' : '执行工具', detail: '进行中', live: true };
        task.messages.push({ type: 'tool', name: planOnly ? 'Plan · 构建执行方案' : 'Search · 检索相关文件', meta: '执行中', detail: planOnly ? '仅生成计划，不执行写操作。' : 'rg --files | rg "(auth|session|permission|task)"', status: 'running', expanded: false });
        task.agents = [{ name: '代码检索', status: 'running', progress: 42, detail: '分析相关模块' }, { name: '风险检查', status: 'waiting', progress: 0, detail: '等待检索结果' }];
        commit();
        schedule(id, () => enterSubagents(id, planOnly), 1400);
      }
      function enterSubagents(id, planOnly) {
        const task = taskById(id); if (!task || task.status === 'cancelled') return;
        const tool = [...task.messages].reverse().find(m => m.type === 'tool' && m.status === 'running');
        if (tool) { tool.status = 'done'; tool.meta = planOnly ? '计划已生成' : '完成 · 9 个文件'; tool.detail += planOnly ? '\n包含 4 个可验证步骤。' : '\nsrc/components/MainContent.jsx\nsrc/components/Sidebar.jsx\nserver/routes/projects.js'; }
        task.status = 'subagent_running';
        task.timeline[2] = { label: planOnly ? '生成执行计划' : '执行工具', detail: '完成', done: true };
        task.timeline.splice(3, 0, { label: '子代理协作', detail: '2 个节点运行中', live: true });
        task.messages.push({ type: 'subagent', name: 'Agent Graph · 并行分析', meta: '2 个子代理执行中', detail: '代码检索节点已完成，风险检查与测试建议节点正在并行处理。' });
        task.agents = [{ name: '代码检索', status: 'completed', progress: 100, detail: '9 个文件' }, { name: '风险检查', status: 'running', progress: 68, detail: '分析边界条件' }, { name: '测试建议', status: 'running', progress: 51, detail: '匹配现有测试' }];
        task.files = [{ name: 'src/components/MainContent.jsx', add: 14, del: 3 }, { name: 'src/components/Sidebar.jsx', add: 9, del: 2 }, { name: 'server/routes/projects.js', add: 0, del: 0 }];
        commit();
        schedule(id, () => enterStreaming(id, planOnly), 1550);
      }
      function enterStreaming(id, planOnly) {
        const task = taskById(id); if (!task || task.status === 'cancelled') return;
        task.status = 'streaming';
        task.timeline[3] = { label: '子代理协作', detail: '完成', done: true };
        task.timeline[4] = { label: '生成结果', detail: '进行中', live: true };
        task.agents = task.agents.map(a => ({ ...a, status: 'completed', progress: 100, detail: a.name === '风险检查' ? '2 个关注项' : a.detail }));
        commit();
        schedule(id, () => completeTask(id, planOnly), 1700);
      }
      function completeTask(id, planOnly = false) {
        const task = taskById(id); if (!task || task.status === 'cancelled') return;
        task.status = 'completed'; task.updatedAt = nowTime();
        task.timeline = task.timeline.map(item => ({ label: item.label, detail: item.label === '生成结果' ? '完成' : item.detail.replace('进行中','完成'), done: true }));
        task.messages.push({ type: 'result', title: planOnly ? '执行计划已完成' : '任务已完成', text: planOnly ? '已生成一份不修改文件的分步执行计划。' : '已完成项目分析，并将结论整理为可执行的后续步骤。', bullets: planOnly ? ['确认涉及模块和依赖边界。', '按最小变更拆分实现步骤。', '为每一步定义验证方式。'] : ['已定位 3 个直接相关文件，现有架构可以支持该方案。', '建议先处理状态同步，再调整视图层交互。', '补充权限拒绝、失败重试和页面切换用例。'] });
        task.artifacts = [{ name: planOnly ? '执行计划' : '任务分析报告', type: 'Markdown', icon: 'file' }, { name: '代码变更摘要', type: 'CodeHub', icon: 'branch' }];
        commit(); showToast('任务已完成');
      }
      function handlePermission(taskId, choice) {
        const task = taskById(taskId); if (!task || task.status !== 'permission_required') return;
        const permission = [...task.messages].reverse().find(m => m.type === 'permission' && !m.decision);
        if (permission) permission.decision = choice;
        if (choice === 'deny') {
          task.status = 'denied'; task.updatedAt = nowTime();
          task.timeline[2] = { label: '执行只读检查', detail: '用户拒绝', error: true };
          task.messages.push({ type: 'assistant', text: '操作已停止。我不会执行这条命令；你可以补充信息，或继续任务并选择其他方式。' });
          commit(); showToast('已拒绝操作', 'error'); return;
        }
        if (choice === 'remember') state.rememberedPermissions = true;
        commit(); beginTools(taskId, false);
      }
      function stopTask(id) {
        const task = taskById(id); if (!task || !(isTaskRunning(task.status) || task.status === 'permission_required')) return;
        clearTaskTimer(id); task.status = 'cancelled'; task.updatedAt = nowTime();
        const pendingPermission = [...task.messages].reverse().find(message => message.type === 'permission' && !message.decision);
        if (pendingPermission) pendingPermission.decision = 'cancelled';
        const live = task.timeline.find(t => t.live); if (live) Object.assign(live, { detail: '已停止', live: false });
        commit(); showToast('任务已停止');
      }
      function retryTask(id) {
        const task = taskById(id); if (!task) return;
        if (task.status === 'denied' || task.status === 'cancelled' || task.status === 'blocked') {
          task.messages.push({ type: 'user', text: '继续任务；如果需要权限，请使用只读替代方案。' });
          task.permissionMode = 'read';
        }
        startTask(id, task.status === 'failed');
      }
      function sendFollowup(id) {
        const input = document.getElementById('task-input'); const value = input?.value.trim();
        if (!value) { showToast('请输入补充信息', 'error'); input?.focus(); return; }
        const task = taskById(id); if (!task) return;
        task.messages.push({ type: 'user', text: value });
        ui.taskDrafts[id] = '';
        task.updatedAt = nowTime(); task.permissionMode = state.rememberedPermissions ? 'read' : task.permissionMode;
        startTask(id, false);
      }

      function runAutomation(id) {
        const auto = state.automations.find(a => a.id === id); if (!auto || auto.status === 'running') return;
        auto.status = 'running'; auto.lastRun = '刚刚';
        commit(); showToast(`正在运行「${auto.name}」`);
        setTimeout(() => {
          const fresh = state.automations.find(a => a.id === id); if (!fresh) return;
          const provider = fresh.model.split(' · ')[0]; const model = fresh.model.split(' · ').slice(1).join(' · ');
          const task = { id: uid('auto-task'), projectId: fresh.projectId, title: fresh.name + ' · 手动运行', status: 'completed', updatedAt: nowTime(), provider, model, permissionMode: 'read', expert: fresh.name.includes('SQL') ? 'SQL 检查专家' : '代码评审专家', prompt: fresh.prompt,
            messages: [{type:'user',text:fresh.prompt},{type:'tool',name:'自动化 · 读取项目变化',meta:'完成',detail:`Scheduled Task: ${fresh.cron}\nProject: ${projectById(fresh.projectId).name}`,status:'done',expanded:false},{type:'result',title:'自动化运行完成',text:'本次定时任务已完成，结果已保存为任务会话。',bullets:['已读取项目最新状态。','未发现阻断性风险。','下次运行将沿用当前配置。']}],
            timeline: [{label:'自动触发',detail:'手动运行',done:true},{label:'读取项目上下文',detail:'完成',done:true},{label:'执行任务',detail:'完成',done:true},{label:'保存运行结果',detail:'完成',done:true}],
            agents:[{name:'Scheduled Task Runner',status:'completed',progress:100,detail:'运行完成'}], files:[], artifacts:[{name:'自动化运行报告',type:'Markdown',icon:'file'}] };
          state.tasks.unshift(task); fresh.status = 'completed'; fresh.lastResult = 'completed'; fresh.lastTaskId = task.id; saveState(); render(); showToast('自动化运行完成，已生成任务会话');
        }, 1800);
      }
      function toggleAutomation(id) {
        const auto = state.automations.find(a => a.id === id); if (!auto || auto.status === 'running') return;
        auto.status = ['enabled','completed'].includes(auto.status) ? 'paused' : 'enabled'; commit(); showToast(auto.status === 'enabled' ? '自动化已启用' : '自动化已暂停');
      }
      function saveAutomationForm() {
        const form = document.getElementById('automation-form'); if (!form || !form.reportValidity()) return;
        const data = Object.fromEntries(new FormData(form).entries()); const editId = form.dataset.editId;
        if (editId) Object.assign(state.automations.find(a => a.id === editId), data);
        else state.automations.unshift({ id: uid('auto'), ...data, model:'Claude · Sonnet 4.5', status:'enabled', lastRun:'尚未运行', lastResult:null, lastTaskId:null });
        saveState(); closeModal(); render(); showToast(editId ? '自动化已更新' : '自动化已创建并启用');
      }

      function resumePendingTasks() {
        state.tasks.forEach(task => {
          if (task.status === 'preparing') schedule(task.id, () => enterReasoning(task.id, false), 700);
          else if (task.status === 'reasoning') schedule(task.id, () => requestTaskPermission(task.id), 700);
          else if (task.status === 'tool_running') schedule(task.id, () => enterSubagents(task.id, task.permissionMode === 'plan'), 700);
          else if (task.status === 'subagent_running') schedule(task.id, () => enterStreaming(task.id, task.permissionMode === 'plan'), 700);
          else if (task.status === 'streaming') schedule(task.id, () => completeTask(task.id, task.permissionMode === 'plan'), 700);
        });
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action], [data-nav]'); if (!target) return;
        if (target.dataset.nav) { navigate(target.dataset.nav); return; }
        const action = target.dataset.action;
        if (action === 'toggle-more') { ui.moreOpen = !ui.moreOpen; ui.accountMenuOpen = false; ui.workspaceMenu = null; ui.commandMenuScope = null; renderSidebar(); return; }
        if (action === 'toggle-account-menu') { ui.accountMenuOpen = !ui.accountMenuOpen; ui.moreOpen = false; ui.workspaceMenu = null; ui.commandMenuScope = null; renderSidebar(); return; }
        if (action === 'toggle-workspace-menu') { ui.workspaceMenu = ui.workspaceMenu === target.dataset.scope ? null : target.dataset.scope; ui.moreOpen = false; ui.accountMenuOpen = false; ui.commandMenuScope = null; render(); return; }
        if (action === 'toggle-skill-command-menu') { ui.commandMenuScope = ui.commandMenuScope === target.dataset.scope ? null : target.dataset.scope; ui.workspaceMenu = null; ui.moreOpen = false; ui.accountMenuOpen = false; render(); return; }
        if (action === 'select-workspace') {
          state.selectedProject = target.dataset.id;
          ui.workspaceMenu = null;
          ui.commandMenuScope = null;
          const available = new Set([
            ...state.experts.filter(expert => isExpertInstalled(expert)).map(expert => expert.name),
            ...state.skills.filter(skill => isSkillEnabled(skill)).map(skill => skill.code),
            ...state.connectors.filter(connector => isConnectorConnected(connector)).map(connector => connector.name)
          ]);
          ui.selectedCapabilities = ui.selectedCapabilities.filter(capability => available.has(capability));
          saveState(); render(); showToast(`已切换到 ${projectById(state.selectedProject).name} 工作区`); return;
        }
        if (action === 'toggle-project') { const id = target.dataset.id; const idx = state.collapsedProjects.indexOf(id); idx >= 0 ? state.collapsedProjects.splice(idx,1) : state.collapsedProjects.push(id); commit(); return; }
        if (action === 'project-info') { openModal(modalShell('空间与项目', 'WorkBuddy 的“空间”映射为 DataAgent 的 Project / Workspace。', `<div class="detail-list">${projects.map(p => `<div class="detail-row"><span class="detail-key">${escapeHtml(p.name)}</span><span>${escapeHtml(p.path)}</span></div>`).join('')}</div>`, `<button class="primary-button" data-action="close-modal">知道了</button>`)); return; }
        if (action === 'more-entry') { showToast(`「${({codehub:'CodeHub',sql:'SQL Check',admin:'管理后台'})[target.dataset.id] || target.dataset.id}」保留现有入口，未扩展为核心原型页面`); ui.moreOpen = false; renderSidebar(); return; }
        if (action === 'open-settings') { ui.accountMenuOpen = false; showSettingsModal(); return; }
        if (action === 'switch-tenant') { state.currentTenant = target.dataset.id; saveState(); closeModal(); render(); showToast(`已切换到 ${tenantById(state.currentTenant).name}`); return; }
        if (action === 'logout') { ui.accountMenuOpen = false; openModal(modalShell('退出登录？', '将结束当前演示账号会话。', '<p style="color:var(--text-2)">本地原型配置不会被删除，再次登录后仍可继续查看。</p>', '<button class="secondary-button" data-action="close-modal">取消</button><button class="danger-button" data-action="confirm-logout">退出登录</button>')); return; }
        if (action === 'confirm-logout') { closeModal(); ui.loggedOut = true; render(); return; }
        if (action === 'login-demo') { ui.loggedOut = false; render(); showToast('已使用演示账号登录'); return; }
        if (action === 'reset-demo') { openModal(modalShell('重置演示？', '会清除本原型保存的选择、启停状态与自动化配置。', '<p style="color:var(--text-2)">当前项目代码和真实数据不会受到影响。</p>', '<button class="secondary-button" data-action="close-modal">取消</button><button class="danger-button" data-action="confirm-reset">重置演示</button>')); return; }
        if (action === 'confirm-reset') { Object.values(ui.timers).forEach(clearTimeout); ui.timers = {}; localStorage.removeItem(STORAGE_KEY); state = clone(defaultState); ui.selectedCapabilities = ['code-review','GitHub']; ui.newPrompt = ''; ui.taskDrafts = {}; ui.commandMenuScope = null; ui.workspaceMenu = null; ui.accountMenuOpen = false; ui.loggedOut = false; ui.fileQuery = ''; ui.selectedFiles = { p1: 'src/components/Sidebar.jsx', p2: 'server/routes/auth.ts', p3: 'queries/retention.sql' }; closeModal(); navigate('#/new'); showToast('演示状态已重置'); return; }
        if (action === 'insert-skill-command') {
          const inputId = target.dataset.input;
          const input = document.getElementById(inputId);
          if (!input) return;
          const command = `/${target.dataset.code}`;
          const nextValue = `${input.value}${input.value && !/\s$/.test(input.value) ? ' ' : ''}${command} `;
          if (target.dataset.task) ui.taskDrafts[target.dataset.task] = nextValue;
          else ui.newPrompt = nextValue;
          ui.commandMenuScope = null;
          render();
          setTimeout(() => { const next = document.getElementById(inputId); if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); } }, 0);
          return;
        }
        if (action === 'open-files') { const projectId = target.dataset.project || state.selectedProject; state.selectedProject = projectId; const path = target.dataset.path; if (path && (workspaceFiles[projectId] || []).some(file => file.path === path)) ui.selectedFiles[projectId] = path; saveState(); navigate('#/files'); return; }
        if (action === 'select-file') { ui.selectedFiles[state.selectedProject] = target.dataset.path; render(); return; }
        if (action === 'choose-capability') { showCapabilityPicker(); return; }
        if (action === 'pick-capability') { const name = target.dataset.name; const i = ui.selectedCapabilities.indexOf(name); i >= 0 ? ui.selectedCapabilities.splice(i,1) : ui.selectedCapabilities.push(name); closeModal(); render(); return; }
        if (action === 'remove-capability') { ui.selectedCapabilities = ui.selectedCapabilities.filter(c => c !== target.dataset.name); render(); return; }
        if (action === 'create-task') { createTaskFromComposer(); return; }
        if (action === 'toggle-block') { const task = taskById(currentRoute().id); const msg = task?.messages[Number(target.dataset.index)]; if (msg) { msg.expanded = !msg.expanded; commit(); } return; }
        if (action === 'permission') { handlePermission(target.dataset.task, target.dataset.choice); return; }
        if (action === 'stop-task') { stopTask(target.dataset.id); return; }
        if (action === 'retry-task') { retryTask(target.dataset.id); return; }
        if (action === 'send-followup') { sendFollowup(target.dataset.id); return; }
        if (action === 'task-more') { showToast('任务菜单：重命名、复制链接、归档（原型）'); return; }
        if (action === 'toggle-context') { ui.contextOpen = true; document.querySelector('.context-panel')?.classList.add('open'); document.querySelector('.scrim')?.classList.add('open'); return; }
        if (action === 'close-context') { ui.contextOpen = false; document.querySelector('.context-panel')?.classList.remove('open'); document.querySelector('.scrim')?.classList.remove('open'); return; }
        if (action === 'context-tab') { ui.contextTab = target.dataset.tab; render(); return; }
        if (action === 'open-artifact') { showToast(`已打开「${target.dataset.name}」（原型）`); return; }
        if (action === 'capability-help') { openModal(modalShell('能力映射', '命名贴近 WorkBuddy，底层继续使用 DataAgent 现有能力。', '<div class="detail-list"><div class="detail-row"><span class="detail-key">专家</span><span>Agent Graph 配置与运行</span></div><div class="detail-row"><span class="detail-key">技能</span><span>Workspace Skills 与技能市场</span></div><div class="detail-row"><span class="detail-key">连接器</span><span>MCP Servers、Tools 与预设</span></div></div>', '<button class="primary-button" data-action="close-modal">知道了</button>')); return; }
        if (action === 'install-expert') { const e = state.experts.find(x => x.id === target.dataset.id); const caps = workspaceCaps(); if (e && !caps.experts.includes(e.id)) { caps.experts.push(e.id); saveState(); closeModal(); render(); showToast(`「${e.name}」已安装到 ${projectById(state.selectedProject).name}`); } return; }
        if (action === 'expert-detail') { showExpertDetail(target.dataset.id); return; }
        if (action === 'skill-detail') { showSkillDetail(target.dataset.id); return; }
        if (action === 'toggle-skill') { const s = state.skills.find(x => x.id === target.dataset.id); if (s) { const caps = workspaceCaps(); const enabled = caps.skills.includes(s.id); if (enabled) caps.skills = caps.skills.filter(id => id !== s.id); else { s.installed = true; caps.skills.push(s.id); } saveState(); closeModal(); render(); showToast(`${s.name}已在当前工作区${enabled ? '停用' : '启用'}`); } return; }
        if (action === 'install-skill') { const s = state.skills.find(x => x.id === target.dataset.id); if (s) { const caps = workspaceCaps(); s.installed = true; if (!caps.skills.includes(s.id)) caps.skills.push(s.id); commit(); showToast(`${s.name}已安装并在当前工作区启用`); } return; }
        if (action === 'connector-detail') { showConnectorDetail(target.dataset.id); return; }
        if (action === 'toggle-connector') { const c = state.connectors.find(x => x.id === target.dataset.id); if (c && ui.testingConnectorId !== c.id) { const caps = workspaceCaps(); const connected = caps.connectors.includes(c.id); caps.connectors = connected ? caps.connectors.filter(id => id !== c.id) : [...caps.connectors, c.id]; c.lastTest = connected ? '已从当前工作区断开' : '刚刚 · 46 ms'; commit(); showToast(`${c.name} 已在当前工作区${connected ? '断开' : '连接'}`); } return; }
        if (action === 'test-connector') { const c = state.connectors.find(x => x.id === target.dataset.id); if (c && isConnectorConnected(c)) { closeModal(); ui.testingConnectorId = c.id; render(); setTimeout(() => { ui.testingConnectorId = null; c.lastTest='刚刚 · 39 ms'; commit(); showToast(`${c.name} 连接测试通过`); }, 1100); } return; }
        if (action === 'connector-presets') { showToast('已打开 MCP 预设入口（原型）'); return; }
        if (action === 'new-automation') { showAutomationForm(); return; }
        if (action === 'edit-automation') { showAutomationForm(target.dataset.id); return; }
        if (action === 'save-automation') { saveAutomationForm(); return; }
        if (action === 'toggle-automation') { toggleAutomation(target.dataset.id); return; }
        if (action === 'run-automation') { runAutomation(target.dataset.id); return; }
        if (action === 'automation-filter') { ui.activeAutomationFilter = target.dataset.filter; render(); return; }
        if (action === 'close-modal') { closeModal(); return; }
        if (action === 'modal-backdrop' && event.target === target) closeModal();
      });

      document.addEventListener('input', event => {
        if (event.target.id === 'new-prompt') ui.newPrompt = event.target.value;
        if (event.target.id === 'task-input') { const taskId = currentRoute().id; if (taskId) ui.taskDrafts[taskId] = event.target.value; }
        if (event.target.id === 'capability-search') { ui.capabilitySearch = event.target.value; const pos = event.target.selectionStart; render(); const next = document.getElementById('capability-search'); if (next) { next.focus(); next.setSelectionRange(pos,pos); } }
        if (event.target.id === 'file-search') { ui.fileQuery = event.target.value; const pos = event.target.selectionStart; render(); const next = document.getElementById('file-search'); if (next) { next.focus(); next.setSelectionRange(pos,pos); } }
      });
      document.addEventListener('change', event => {
        if (event.target.id === 'capability-category') { ui.capabilityCategory = event.target.value; render(); }
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') { if (document.getElementById('modal-root').innerHTML) closeModal(); else if (ui.contextOpen) { ui.contextOpen = false; render(); } else if (ui.commandMenuScope) { ui.commandMenuScope = null; render(); } else if (ui.workspaceMenu) { ui.workspaceMenu = null; render(); } else if (ui.moreOpen || ui.accountMenuOpen) { ui.moreOpen = false; ui.accountMenuOpen = false; renderSidebar(); } }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'n') { event.preventDefault(); navigate('#/new'); }
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          if (document.getElementById('new-prompt')) { event.preventDefault(); createTaskFromComposer(); }
          else { const route = currentRoute(); if (route.page === 'task') { event.preventDefault(); sendFollowup(route.id); } }
        }
      });
      window.addEventListener('hashchange', render);
      window.addEventListener('storage', () => { state = loadState(); render(); });

      if (!location.hash) location.hash = '#/new';
      render();
      resumePendingTasks();
    })();
  </script>
</body>
</html>
