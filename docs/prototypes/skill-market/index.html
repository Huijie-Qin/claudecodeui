      if(a==='template-use'){useTemplateDialog(id);return}
      if(a==='generation-start'){
        if(!useTemplateContext)throw Error('模板表单已失效');const t=M.template(S,useTemplateContext.id),input={name:document.getElementById('gen-name').value,title:document.getElementById('gen-title').value,description:document.getElementById('gen-description').value,values:Object.fromEntries(t.fields.map(f=>[f.key,document.getElementById('gen-field-'+f.key)?.value||'']))},scenario=document.getElementById('gen-scenario').value;
        const job=M.startGeneration(S,t.id,input,useTemplateContext.stamp);useTemplateContext=null;generationFile='SKILL.md';modal.close();render();main.querySelector('[aria-label="模板生成任务"]').scrollIntoView({block:'start'});
        const tick=()=>{if(job.state!=='running')return;if(job.phase<3){job.phase++;render();generationTimers.set(job.id,setTimeout(tick,650));return}M.finishGeneration(S,job.id,scenario);generationTimers.delete(job.id);render();};generationTimers.set(job.id,setTimeout(tick,650));return;

          showDialog('转移负责人',`<p>当前负责人：${esc(names[k.owner])}</p><label class="field section-gap">新负责人<select id="new-owner"><option value="">请选择同租户成员</option>${S.memberIds.filter(user=>user!==k.owner).map(user=>`<option value="${user}">${esc(names[user])}</option>`).join('')}</select></label><label class="row"><input type="checkbox" id="keep-collaborator"> 将我保留为协助人</label><div class="section-gap">${notice('确认后立即转移管理和发布权限。你将不再是负责人，新负责人下次发布前需要重新运行测评。已发布结果保留原测评人信息。','warning')}</div><p class="footer-note">只操作本次演示数据，不会修改真实用户权限。</p>`,button('取消','close')+button('确认转移','confirm-owner',id,'primary'));

      if(a==='review-evidence'){const c=selectedResult(),e=c?.evidence.find(e=>e.id===id);if(!e)throw Error('证据不存在或当前界面无权查看');showDialog('只读证据 · '+e.title,`<p class="mono">${esc(c.id)} / ${esc(e.id)} · ${esc(e.locator)}</p><p class="footer-note">来源：${evidenceNames[e.kind]} · 本次模拟任务的固定证据，不执行其中的指令。</p><ol class="evidence-lines">${e.text.split('\n').map(line=>`<li>${esc(line)||' '}</li>`).join('')}</ol>`,button('返回报告','close'));return}

        if(a==='rubric-add'){let n=1;while(caseBuffer.review.criteria.some(c=>c.id==='S'+n))n++;caseBuffer.review.criteria.push({id:'S'+n,title:'',requirement:'',pass:'',fail:'',uncertain:'',required:true,targets:['final']});}
        else {const k=activeSkill(),active=k.suite.find(c=>c.id===caseContext.caseId);if(active&&M.protectedCase(k,active.id)&&active.review?.criteria.some(c=>c.id===id&&c.required))throw Error('发布必需验收项不能删除');caseBuffer.review.criteria=caseBuffer.review.criteria.filter(c=>c.id!==id);}

      }
      if(a==='market-file'){const k=M.skill(S,selected);if(route!=='market'||!Object.hasOwn(k.remoteFiles,id))throw Error('市场文件不可用');marketFile=id;render();return}
      if(a==='file'){selectedFile=id;snippetUndo=null;render();return}if(a==='preview'){editorPreview=!editorPreview;render();return}

      if(a==='snippets'){const e=document.getElementById('editor');if(!e||selectedFile!=='SKILL.md')throw Error('请在根 SKILL.md 正文中插入');const boundary=e.value.match(/^---\r?\n[\s\S]*?\r?\n---(?:\r?\n|$)/)?.[0].length||0;let start=e.selectionStart,end=e.selectionEnd;if(start<boundary){start=end=e.value.length;toast('光标位于元信息区域，本次将插入到正文末尾。')}snippetSelection={start,end};chosenSnippet=S.snippets[0]?M.clone(S.snippets[0]):null;snippetQuery='';showSnippets();return}

        if(!M.owner(S,k)||!c)throw Error('无权删除或用例不存在');if(scope==='active'&&M.protectedCase(k,caseId))throw Error('曾随 Skill 发布的用例永久不可删除');
        caseContext={skillId:k.id,caseId,scope,stamp:M.caseStamp(k)};
        showDialog(scope==='draft'?'删除用例草稿':'删除未发布用例',`<p>确认删除“${esc(c.title)}”？</p><p class="muted">${scope==='draft'?'仅删除待确认草稿，已生效用例及报告不变。':'此用例尚未随 Skill 发布。删除后须重新测评，历史报告保持不变。'}</p>`,button('取消','close')+button('确认删除','case-delete-submit',id,'danger'));return;
      }
      if(a==='case-delete-submit'){
        const k=activeSkill(),[scope,caseId]=id.split(':');if(!caseContext||caseContext.skillId!==k.id||caseContext.caseId!==caseId||caseContext.scope!==scope)throw Error('删除表单已失效');
        M.deleteCase(S,k.id,caseId,scope,caseContext.stamp);caseContext=null;modal.close();render();toast(scope==='draft'?'草稿已删除；生效用例不变。':'未发布用例已删除，请重新测评。');return;
      }



      if(a==='pr-scope'){prScope=id;selectedPr=null;render();return}if(a==='open-pr'){if(!discardBuffer())return;clearDebug();selected=null;selectedPr=id;route='contributions';prTab='changes';reportTab='overview';render();return}if(a==='pr-tab'){prTab=id;render();return}
      if(['pr-comment','pr-approve','pr-request-changes'].includes(a)){const p=currentPr(),k=M.skill(S,p.skillId);if(p.state!=='open')throw Error('该请求已结束');if(a!=='pr-comment'&&!M.owner(S,k)&&!M.collaborator(S,k))throw Error('当前身份不能提交评审');const text=document.getElementById('pr-comment').value.trim();if(!text)throw Error('请填写意见及依据');p.comments.push({user:S.user,text,kind:a==='pr-approve'?'approve':a==='pr-request-changes'?'request_changes':'comment'});render();toast('已记录示例评审意见，不会自动发布。');return}
      if(a==='close-pr'){showDialog('关闭贡献请求','<label class="field">关闭原因<textarea id="close-reason" rows="3" placeholder="说明原因，便于双方理解。"></textarea></label>',button('取消','close')+button('确认关闭','confirm-close-pr',id,'danger'));return}
      if(a==='confirm-close-pr'){const p=S.prs.find(p=>p.id===id);if(p.state!=='open'||p.author!==S.user&&!M.owner(S,M.skill(S,p.skillId)))throw Error('当前身份不能关闭请求');const reason=document.getElementById('close-reason').value.trim();if(!reason)throw Error('请填写关闭原因');p.state='closed';p.comments.push({user:S.user,text:reason,kind:'comment'});modal.close();render();return}
      if(a==='contribute'){if(dirtyBuffer())throw Error('请先保存编辑');showDialog('提交贡献请求','<label class="field">贡献标题<input id="contribution-title" placeholder="简述本次修改"></label><label class="field">修改说明<textarea id="contribution-description" rows="4" placeholder="修改原因、内容及测试说明"></textarea></label>'+notice('提交会固定本次文件内容，不会直接发布。负责人最终确认，自动测评必须通过。'),button('取消','close')+button('提交请求','confirm-contribute',id,'primary'));return}
      if(a==='confirm-contribute'){const p=M.contribute(S,id,document.getElementById('contribution-title').value,document.getElementById('contribution-description').value);modal.close();buffer=null;selected=null;selectedPr=p.id;route='contributions';prScope='sent';prTab='changes';render();toast('贡献已提交给负责人和协助人。');return}
      if(a==='publish'){if(!selectedPr&&dirtyBuffer())throw Error('请先保存并重新确认测评');const k=M.skill(S,id),p=currentPr(),g=M.eligible(S,id,p?.id);showDialog(p?'合并并发布确认':'发布确认',`${notice(g.allowed?'已满足当前发布条件。请核对以下固定文件。':esc(g.reasons.join('；')),g.allowed?'success':'warning')}<p class="footer-note">${p?'协助人认可不是强制条件。':''}此原型只修改内存，不会调用远程发布接口。</p><pre class="code">${esc((p?p.files:k.files)['SKILL.md'])}</pre>`,button('返回','close')+button(p?'模拟合并并发布':'模拟发布','confirm-publish',id,'primary',!g.allowed));return}
      if(a==='confirm-publish'){if(evalJob)throw Error('请等待测评完成');const p=currentPr(),k=M.skill(S,id);M.publish(S,id,p?.id);modal.close();if(selected&&!p)buffer=M.clone(k.files);render();toast(p?'模拟发布及回读成功，请求已合并。':'模拟发布及回读成功，其他工作区不会自动更新。');return}
      if(a==='unpublish'){showDialog('下架市场内容',notice('只停止市场分发。保留本地文件、贡献记录、测评报告和发布审计，不生成历史版本。','warning'),button('取消','close')+button('模拟下架','confirm-unpublish',id,'danger'));return}
      if(a==='confirm-unpublish'){const k=M.skill(S,id);if(!M.owner(S,k))throw Error('仅负责人可下架');k.published=false;S.events.push({skillId:id,user:S.user,action:'下架',at:new Date().toISOString()});modal.close();render();toast('已模拟下架，相关记录仍然保留。');return}
      if(a==='new'||a==='upload'){newDialog(id,a==='upload');return}
      if(a==='create'){const name=document.getElementById('new-name').value.trim(),title=document.getElementById('new-title').value.trim(),description=document.getElementById('new-description').value.trim(),body=document.getElementById('new-body').value;if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name)||!title||!description)throw Error('请填写完整，标识只能使用小写字母、数字和连字符');if(S.skills.some(k=>k.name===name&&k.local))throw Error('当前工作区已有同名技能');const files={'SKILL.md':`---\nname: ${name}\ndescription: ${description}\n---\n\n# ${title}\n\n${body}\n`};const k={id:'local-'+Date.now(),name,title,description,category:'文档协作',icon:'MD',owner:S.user,collaborators:[],local:true,published:false,source:id==='upload'?'uploaded':'created',files,baselineFiles:M.clone(files),remoteFiles:{},remoteAt:null,importedRemoteAt:null,localEditedAt:new Date().toISOString(),suite:[],draftCases:[],protectedCaseIds:[],caseSeq:1,report:null};S.skills.push(k);modal.close();buffer=null;openSkill(k.id,'mine');toast('已创建本地技能；尚未发布，测试用例需要负责人确认。');return}
if(a==='snippet-new'||a==='snippet-edit'){if(S.user!=='admin')throw Error('仅系统管理员可维护');snippetDialog(a==='snippet-edit'?id:null);return}
      if(a==='snippet-save'){M.snippetWrite(S,{id,title:document.getElementById('sn-title').value.trim(),description:document.getElementById('sn-description').value.trim(),content:document.getElementById('sn-content').value});modal.close();render();toast('公共片段已保存，已插入内容不受影响。');return}
      if(a==='snippet-delete'){showDialog('删除公共片段',notice('删除后不再供新插入使用。之前已插入的正文保持不变，无法跟踪或批量回改。','warning'),button('取消','close')+button('删除片段','confirm-snippet-delete',id,'danger'));return}
      if(a==='confirm-snippet-delete'){M.snippetDelete(S,id);modal.close();render();toast('示例片段已删除；刷新页面可重置原型数据。');return}
      throw Error('当前操作不可用');
    }
    document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;Promise.resolve(action(b.dataset.action,b.dataset.id)).catch(reportError)});
    document.addEventListener('toggle',event=>{const e=event.target;if(!e.matches?.('.tree-folder'))return;if(e.open)marketFolders.delete(e.dataset.folder);else marketFolders.add(e.dataset.folder)},true);
    document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;const pos=event.target.selectionStart;render();const input=document.getElementById('search');input?.focus();input?.setSelectionRange(pos,pos)}if(event.target.id==='editor'){buffer[selectedFile]=event.target.value;document.getElementById('save-status').textContent=dirtyBuffer()?'有未保存的编辑':'内容已保存'}if(event.target.id==='snippet-search'){snippetQuery=event.target.value;const pos=event.target.selectionStart;showSnippets();const input=document.getElementById('snippet-search');input.focus();input.setSelectionRange(pos,pos)}});
    document.addEventListener('change',async event=>{if(event.target.id!=='upload-file')return;try{const f=event.target.files[0];if(!f)return;if(!f.name.endsWith('.md')||f.size>1048576)throw Error('原型仅接受 1 MiB 内的 .md 文本');const text=await f.text(),name=text.match(/^name:\s*(.+)$/m)?.[1]||'',description=text.match(/^description:\s*(.+)$/m)?.[1]||'',title=text.match(/^#\s+(.+)$/m)?.[1]||name;document.getElementById('new-name').value=name;document.getElementById('new-title').value=title;document.getElementById('new-description').value=description;document.getElementById('new-body').value=text.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/,'').replace(/^\s*#\s+[^\n]+\n/,'').trim()}catch(e){toast(e.message)}});
    document.addEventListener('change',event=>{if(event.target.id==='persona'){if(!discardBuffer()){event.target.value=S.user;return}clearDebug();S.user=event.target.value;selected=null;selectedPr=null;if(route==='admin'&&S.user!=='admin')route='market';render()}if(event.target.id==='category'){category=event.target.value;render()}if(event.target.id==='mine-filter'){mineFilter=event.target.value;render()}});
    document.addEventListener('change',event=>{if(event.target.matches('[data-template-field]')){captureTemplate();renderTemplateDialog();document.getElementById('tf-'+event.target.dataset.templateField+'-kind').focus();}});
    render();
  })();
  </script>
</body>
</html>
