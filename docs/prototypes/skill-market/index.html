    function evaluationContext(k,p=null,market=false){
      const w=M.localState(S,k),j=market?null:M.fileEvaluation(S,k);
      const pub=k.marketFileReport?.content===M.canonical(k.remoteFiles)&&k.marketFileReport?.publishedRemoteAt===k.remoteAt?k.marketFileReport:null;
      const legacy=market&&!pub?M.publishedReport(S,k.id):null;
      const r=market?(pub||legacy):j,results=market?(pub?.results||legacy?.results.map((r,i)=>({...r,id:i+1}))||[]):j?(j.optimize&&j.iteration>0?j.after:j.before):[];
      let rows=[],error='';try{rows=market?(r?M.readEval(k,k.remoteFiles).evals:[]):j?j.caseSnapshot:M.readEval(k,w.files).evals}catch(e){error=e.message}
      const stale=!!j&&(j.expectedContent!==M.canonical(w.files)||j.authorityEpoch!==(k.authorityEpoch||0));
      return {k,market,j,r,results,rows,error,stale,running:j?.state==='running',editable:!market&&M.canLocalEdit(S,k),current:market?!!r:!!j&&j.state==='completed'&&!stale};
    }
    function evaluationTableView(k,p=null,market=false){
      const {j,r,results,rows,error,stale,running,editable,current}=evaluationContext(k,p,market);
      const passed=results.filter(c=>c.status==='passed').length;
      const phase=j?.phase==='before'?(j?.optimize?'第一遍 · 串行运行全部':'串行运行全部'):j?.phase==='optimize'?'根据实际与预期优化 Skill':'第 '+j?.iteration+' 次迭代 · 串行复测全部';
      const conclusion=error?error:running?phase+' · '+(Math.min(j.cursor+1,rows.length))+' / '+rows.length:stale?'工作区已修改；以下为启动时固定内容的测评结果':j?.state==='cancelled'?'任务已停止':j?.state==='failed'||j?.state==='stale'?j.reason:current?(j?.written?'修改已保存；':j?.noChange?'无需修改；':'')+passed+' / '+rows.length+' 个用例通过':market?'未测评':'尚未运行';
      return '<section class="stack evaluation-sheet">'+(!market?notice('测评和自动调优使用启动时固定的 Skill、用例及输入资料副本；期间修改 Skill 不会影响本次执行。调优回写若遇到新编辑，将保留新编辑和调优结果，不覆盖。'):'')+'<header><div class="eval-heading"><h2>技能测评</h2>'+
        (market?'':'<div class="eval-toolbar row">'+button('运行全部','table-run',k.id,'',!editable||running||!!error)+button('自动优化','opt-open',k.id,'',!editable||running||!!error)+
        '<details class="eval-add"><summary class="button">添加验证场景 <span aria-hidden="true">⌄</span></summary><div class="eval-add-options" aria-label="添加验证场景方式">'+button('AI准备场景','case-generate',k.id,'',!editable||running)+button('添加场景','case-new',k.id,'',!editable||running)+'</div></details>'+
        (running?button('停止','file-eval-stop',k.id,'danger'):'')+(j?.optimized?button('查看 Skill 修改对比','file-eval-diff',k.id):'')+'</div>')+'</div><p class="small muted eval-heading-note">用例文件：evals/evals.json · 按文件顺序串行执行 · 预期与实际逐条对比</p></header>'+
        '<div class="eval-summary" aria-live="polite"><strong>'+esc(conclusion)+'</strong>'+(j?.optimize?'<p class="small muted">已执行 '+j.iteration+' / '+j.maxIterations+' 次迭代'+(j.state==='running'?'':' · '+esc(j.reason))+'</p>':'')+(j?.writebackConflict?'<p class="small muted">工作区有新编辑，本轮调优仅保存在任务副本；未覆盖工作区。可查看修改对比。</p>':j?.written?'<p class="small muted">改动已自动保存到我的技能，不需要确认或采用；尚未发布。复测失败也会保留已保存修改。</p>':'')+(r&&market?'<p class="small muted">发布测评人 '+esc(names[r.publishedBy||r.initiatedBy])+' · 当前发布内容的只读报告</p>':'')+'</div>'+
        (error?notice(esc(error),'warning'):'')+
        '<div class="eval-table-scroll" role="region" tabindex="0" aria-label="测评结果，可左右滚动"><table class="evaluation-table"><thead><tr><th>验证场景</th><th>预期结果</th><th>'+(j?.optimize?'优化前':'运行结果')+'</th>'+(j?.optimize?'<th>优化后</th>':'')+'<th>操作</th></tr></thead><tbody>'+
        '<tr><th scope="row">静态检查</th><td>文件结构、用例格式与输入资源</td><td>'+badge(market&&r?(r.staticBlocked?'failed':'passed'):j?.staticBefore===undefined?'not_run':j.staticBefore?'passed':'failed')+'</td>'+(j?.optimize?'<td>'+badge(j.staticAfter===undefined?'not_run':j.staticAfter?'passed':'failed')+'</td>':'')+'<td>'+button('查看详情','table-detail','__static__','sm')+'</td></tr>'+
        rows.map((c,i)=>{const before=j?.before.find(x=>x.id===c.id),after=j?.after.find(x=>x.id===c.id),r=results[i];const status=(x,active=false)=>active?badge('running','运行中'):stale&&x?badge('warning','旧结果 · '+(statusNames[x.status]||x.status)):badge(x?.status||'not_run',x?undefined:'未运行');return '<tr><th scope="row"><strong>'+esc(c.prompt)+'</strong><div class="small muted">#'+c.id+((k.protectedEvalIds||[]).includes(c.id)?' · 已发布用例':'')+'</div></th><td>'+esc(c.expected_output)+'</td><td>'+status(j?before:r,running&&j?.phase==='before'&&j.cursor===i)+'</td>'+(j?.optimize?'<td>'+status(after,running&&j?.phase==='after'&&j.cursor===i)+'</td>':'')+'<td><div class="row">'+button('查看详情','table-detail',String(c.id),'sm')+(editable?button('编辑','case-edit',String(c.id),'sm',running)+button('删除','case-delete',String(c.id),'sm danger',running||(k.protectedEvalIds||[]).includes(c.id)):'')+'</div></td></tr>'}).join('')+

    function evaluationTableDetail(id){
      const k=activeSkill(),ctx=evaluationContext(k,null,route==='market');

      const c=ctx.j?.caseSnapshot.find(c=>String(c.id)===String(id))||ctx.rows.find(c=>String(c.id)===String(id));

      const result=ctx.results.find(c=>String(c.id)===String(id)),before=ctx.j?.before.find(x=>x.id===c.id),after=ctx.j?.after.find(x=>x.id===c.id);

        '<h3>输入</h3><pre class="code">'+esc(c.prompt)+'</pre><h3>预期输出</h3><pre class="code">'+esc(c.expected_output)+'</pre>'+

        '<div class="eval-output-scroll" role="region" tabindex="0" aria-label="用例完整会话输出"><div class="eval-output-grid'+(ctx.j?.optimize?' compare':'')+'">'+(ctx.j?.optimize?output('优化前 · 初始前测完整输出',before)+output(ctx.j.iteration?'优化后 · 第 '+ctx.j.iteration+' 次迭代完整输出':'优化后 · 未执行优化',after):output('实际输出',result))+'</div></div>',button('关闭','close'));
      modal.classList.add('eval-output-dialog');

    function evaluationOutputView(label,r){
      const messages=r?.messages?.length?r.messages:r?.actual?[{role:'assistant',content:r.actual},...(r.tools?[{role:'tool',name:'执行记录',content:r.tools}]:[])]:[];

      else {const artifact=c.artifacts.find(a=>a.id===artifactPick)||c.artifacts[0];body=`<h3>最终答复</h3><pre class="code">${esc(c.evidence.find(e=>e.kind==='final')?.text||'没有有效的最终答复。')}</pre><h3 class="section-gap">实际生成文件</h3>${artifact?`<div class="pills">${c.artifacts.map(a=>button(esc(a.name),'artifact-pick',a.id,'sm')).join('')}</div><div class="detail-meta"><span>${esc(artifact.mime)}</span><span>解析覆盖：${esc(artifact.coverage)}</span><span>已封存 · 只读示例</span></div><div class="artifact-content document">${markdown(c.evidence.find(e=>e.id===artifact.evidenceId)?.text||'')}</div>${evidenceButtons(c,[artifact.evidenceId])}`:'<p class="review-empty">本次没有文件产物。纯文字任务不要求生成文件。</p>'}<p class="footer-note">原型展示内置文件内容，不读取真实工作区。正式实现读取实际文件并验证类型、摘要与解析覆盖；文本提取不代表排版或图片已验收。</p>`;}

    function quickInsertTransaction(text,selection,content,inline=false){
      if(!selection||selection.before!==text)throw Error('正文已变化，请重新打开快捷插入');
      const {start,end}=selection,boundary=text.match(/^---\r?\n[\s\S]*?\r?\n---(?:\r?\n|$)/)?.[0].length||0;
      if(!Number.isInteger(start)||!Number.isInteger(end)||start<boundary||end<start||end>text.length||typeof content!=='string'||!content.trim())throw Error('请选择有效正文位置和插入内容');
      const before=text.slice(0,start),after=text.slice(end),prefix=before&&!before.endsWith('\n')?'\n\n':'',suffix=after&&!after.startsWith('\n')?'\n\n':'';
      const inserted=inline?content:prefix+content+suffix;return {before:text,after:before+inserted+after,cursor:start+inserted.length};
    }

      if(a==='case-save'){
        if(!caseContext||caseContext.skillId!==selected||caseContext.user!==S.user)throw Error('用例表单已失效');
        const lines=id=>String(document.getElementById(id).value||'').split('\n').map(x=>x.trim()).filter(Boolean);
        M.writeEvalCase(S,selected,{prompt:document.getElementById('case-prompt').value,expected_output:document.getElementById('case-expected').value,files:lines('case-files'),expectations:lines('case-expectations')},caseContext.caseId,caseContext.file);
        buffer=M.clone(M.localState(S,activeSkill()).files);caseContext=null;modal.close();render();toast('已保存至 evals/evals.json，可直接运行。');return;
      }
      if(a==='case-delete'){
        const k=activeSkill(),c=M.readEval(k,M.localState(S,k).files).evals.find(c=>String(c.id)===id);
        if(!c)throw Error('用例不存在');showDialog('删除未发布用例','<p>删除后会更新 evals/evals.json。曾发布用例不可删除。</p><p>'+esc(c.prompt)+'</p>',button('取消','close')+button('删除','case-delete-submit',id,'danger'));return;
      }
      if(a==='case-delete-submit'){M.deleteEvalCase(S,selected,Number(id));buffer=M.clone(M.localState(S,activeSkill()).files);modal.close();render();return}
      if(a==='pr-file'){prFile=id;render();return}
      if(a==='pr-back'){const target=prReturnSkill||currentPr()?.skillId;selectedPr=null;if(target){const k=M.skill(S,target),own=M.owner(S,k);openSkill(target,own?'mine':'market');detailTab=own?'versions':'contributions'}render();return}
      if(a==='pr-scope'){prScope=id;selectedPr=null;render();return}
      if(a==='open-pr'){if(!discardBuffer())return;prReturnSkill=selected;selected=null;selectedPr=id;prTab='changes';prFile='';reportTab='overview';render();return}
      if(a==='pr-tab'){if(!['changes','discussion'].includes(id))throw Error('无此贡献页签');prTab=id;render();return}
      if(['pr-comment','pr-approve','pr-request-changes'].includes(a)){
        const p=currentPr();M.reviewContribution(S,p.id,a==='pr-approve'?'approve':a==='pr-request-changes'?'request_changes':'comment',document.getElementById('pr-comment').value,M.reviewStamp(p));render();toast('评审已记录，由负责人最终合并。');return;
      }
      if(a==='close-pr'){showDialog('关闭贡献请求','<label class="field">关闭原因<textarea id="close-reason" rows="3" placeholder="说明原因，便于双方理解。"></textarea></label>',button('取消','close')+button('确认关闭','confirm-close-pr',id,'danger'));return}
      if(a==='confirm-close-pr'){const p=S.prs.find(p=>p.id===id);if(p.state!=='open'||p.author!==S.user&&!M.owner(S,M.skill(S,p.skillId)))throw Error('当前身份不能关闭请求');const reason=document.getElementById('close-reason').value.trim();if(!reason)throw Error('请填写关闭原因');p.state='closed';p.comments.push({user:S.user,text:reason,kind:'comment'});modal.close();render();return}
      if(a==='contribute'){if(dirtyBuffer())throw Error('请先保存编辑');showDialog('提交贡献请求','<label class="field">贡献标题<input id="contribution-title" placeholder="简述本次修改"></label><label class="field">修改说明<textarea id="contribution-description" rows="4" placeholder="修改原因、内容及测试说明"></textarea></label>'+notice('提交会固定本次文件内容，无需测评。其他用户可评审，最终由负责人合并并更新市场发布内容。'),button('取消','close')+button('提交请求','confirm-contribute',id,'primary'));return}
      if(a==='confirm-contribute'){const p=M.contribute(S,id,document.getElementById('contribution-title').value,document.getElementById('contribution-description').value);modal.close();buffer=null;selected=null;selectedPr=p.id;route='market';prScope='sent';prTab='changes';render();prReturnSkill=null;toast('贡献已提交，可在市场技能详情中查看和评审。');return}
      if(a==='publish'&&selectedPr){
        const p=currentPr(),k=M.skill(S,p.skillId),g=M.mergeEligibility(S,k.id,p.id),n=M.approvals(S,p).length;
        prConfirm={id:p.id,stamp:M.mergeStamp(S,p)};
        showDialog(n?'合并并发布':'负责人直接合并',`<p>${n?n+' 位用户已认可本次提交。':'尚无其他用户认可，你将以负责人身份直接合并。'}</p><p class="section-gap">本次合并会立即更新市场的 ${M.contributionFiles(p).length} 个文件，无需测评。市场测评页将显示“未测评”。</p>${g.allowed?'':notice(esc(g.reasons.join('；')),'warning')}<ul>${M.contributionFiles(p).map(f=>`<li class="mono">${esc(f.path)}</li>`).join('')}</ul>`,button('取消','close')+button(n?'确认合并并发布':'确认直接合并','pr-merge-confirm',p.id,'primary',!g.allowed));return;
      }
      if(a==='pr-merge-confirm'){
        const p=currentPr();if(!prConfirm||prConfirm.id!==id||p?.id!==id)throw Error('合并确认已失效');
        M.mergeContribution(S,p.skillId,id,prConfirm.stamp);prConfirm=null;modal.close();render();toast('已合并并更新市场发布内容，当前内容未测评。');return;
      }
      if(a==='publish'){if(!selectedPr&&dirtyBuffer())throw Error('请先保存并重新确认测评');const k=M.skill(S,id),p=currentPr(),g=M.releaseFileEligibility(S,id);showDialog(p?'合并并发布确认':'发布确认',`${notice(g.allowed?'已满足当前发布条件。请核对以下固定文件。':esc(g.reasons.join('；')),g.allowed?'success':'warning')}<p class="footer-note">此原型只修改内存，不会调用远程发布接口。</p><p class="footer-note">发布包包含 evals/evals.json 和输入资料，请确认所有内容适合共享。</p>${Object.entries(M.localState(S,k).files).map(([path,text])=>`<details ${path==='SKILL.md'?'open':''}><summary>${esc(path)}</summary><pre class="code">${esc(text)}</pre></details>`).join('')}`,button('返回','close')+button(p?'模拟合并并发布':'模拟发布','confirm-publish',id,'primary',!g.allowed));return}
      if(a==='confirm-publish'){if(evalJob)throw Error('请等待测评完成');const p=currentPr(),k=M.skill(S,id);M.publishFileEvaluation(S,id);modal.close();if(selected&&!p)buffer=M.clone(M.localState(S,k).files);render();toast(p?'模拟发布及回读成功，请求已合并。':'模拟发布及回读成功，其他工作区不会自动更新。');return}
      if(a==='unpublish'){showDialog('下架市场内容',notice('只停止市场分发。保留本地文件、贡献记录、测评报告和发布审计，不生成历史版本。','warning'),button('取消','close')+button('模拟下架','confirm-unpublish',id,'danger'));return}
      if(a==='confirm-unpublish'){const k=M.skill(S,id);if(!M.owner(S,k))throw Error('仅负责人可下架');k.published=false;S.events.push({skillId:id,user:S.user,action:'下架',at:new Date().toISOString()});modal.close();render();toast('已模拟下架，相关记录仍然保留。');return}
      if(a==='new'||a==='upload'){newDialog(id,a==='upload');return}
      if(a==='create'){const name=document.getElementById('new-name').value.trim(),title=document.getElementById('new-title').value.trim(),description=document.getElementById('new-description').value.trim(),body=document.getElementById('new-body').value;if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name)||!title||!description)throw Error('请填写完整，标识只能使用小写字母、数字和连字符');if(S.skills.some(k=>k.name===name&&k.local))throw Error('当前工作区已有同名技能');const files={'SKILL.md':`---\nname: ${name}\ndescription: ${description}\n---\n\n# ${title}\n\n${body}\n`};const k={id:'local-'+Date.now(),name,title,description,category:'文档协作',icon:'MD',owner:S.user,collaborators:[],local:true,published:false,source:id==='upload'?'uploaded':'created',files,baselineFiles:M.clone(files),remoteFiles:{},remoteAt:null,importedRemoteAt:null,localEditedAt:new Date().toISOString(),suite:[],draftCases:[],protectedCaseIds:[],caseSeq:1,report:null};M.initializeEval(k);S.skills.push(k);modal.close();buffer=null;openSkill(k.id,'mine');toast('已创建本地技能；尚未发布；用例保存于 evals/evals.json，无需二次确认。');return}
if(a==='snippet-new'||a==='snippet-edit'){if(S.user!=='admin')throw Error('仅系统管理员可维护');snippetDialog(a==='snippet-edit'?id:null);return}
      if(a==='snippet-save'){M.snippetWrite(S,{id,title:document.getElementById('sn-title').value.trim(),description:document.getElementById('sn-description').value.trim(),content:document.getElementById('sn-content').value});modal.close();render();toast('公共片段已保存，已插入内容不受影响。');return}
      if(a==='snippet-delete'){showDialog('删除公共片段',notice('删除后不再供新插入使用。之前已插入的正文保持不变，无法跟踪或批量回改。','warning'),button('取消','close')+button('删除片段','confirm-snippet-delete',id,'danger'));return}
      if(a==='confirm-snippet-delete'){M.snippetDelete(S,id);modal.close();render();toast('示例片段已删除；刷新页面可重置原型数据。');return}
      throw Error('当前操作不可用');
    }
    document.addEventListener('click',event=>{document.querySelectorAll('.eval-add[open]').forEach(menu=>{if(!menu.contains(event.target)||event.target.closest('[data-action]'))menu.open=false});const b=event.target.closest('[data-action]');if(!b||b.disabled)return;Promise.resolve(action(b.dataset.action,b.dataset.id)).catch(reportError)});
    document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;const menu=document.querySelector('.eval-add[open]');if(menu){menu.open=false;menu.querySelector('summary').focus();event.preventDefault()}});
    document.addEventListener('toggle',event=>{const e=event.target;if(!e.matches?.('.tree-folder'))return;if(e.open)marketFolders.delete(e.dataset.folder);else marketFolders.add(e.dataset.folder)},true);
    document.addEventListener('input',event=>{if(event.target.id==='chat-input')chatDraft=event.target.value;if(event.target.dataset.catalogSearch){updateCatalogSearch(event.target.dataset.catalogSearch,event.target.value);return}if(event.target.id==='search'){query=event.target.value;const pos=event.target.selectionStart;render();const input=document.getElementById('search');input?.focus();input?.setSelectionRange(pos,pos)}if(event.target.id==='editor'){buffer[selectedFile]=event.target.value;document.getElementById('save-status').textContent=dirtyBuffer()?'有未保存的编辑':'内容已保存'}if(event.target.id==='snippet-search'){snippetQuery=event.target.value;const pos=event.target.selectionStart;showSnippets();const input=document.getElementById('snippet-search');input.focus();input.setSelectionRange(pos,pos)}});
    document.addEventListener('keydown',event=>{if(!event.target.matches('[role="tab"][data-action="quick-tab"]')||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const index=quickInsertTabs.findIndex(([type])=>type===quickInsertType),next=event.key==='Home'?0:event.key==='End'?quickInsertTabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+quickInsertTabs.length)%quickInsertTabs.length;extraAction('quick-tab',quickInsertTabs[next][0]).catch(reportError)});
    document.addEventListener('change',async event=>{if(event.target.id!=='upload-file')return;try{const f=event.target.files[0];if(!f)return;if(!f.name.endsWith('.md')||f.size>1048576)throw Error('原型仅接受 1 MiB 内的 .md 文本');const text=await f.text(),name=text.match(/^name:\s*(.+)$/m)?.[1]||'',description=text.match(/^description:\s*(.+)$/m)?.[1]||'',title=text.match(/^#\s+(.+)$/m)?.[1]||name;document.getElementById('new-name').value=name;document.getElementById('new-title').value=title;document.getElementById('new-description').value=description;document.getElementById('new-body').value=text.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/,'').replace(/^\s*#\s+[^\n]+\n/,'').trim()}catch(e){toast(e.message)}});
    document.addEventListener('change',event=>{if(event.target.id==='pr-filter'){prFilter=event.target.value;render()}if(event.target.id==='persona'){if(!discardBuffer()){event.target.value=S.user;return}S.user=event.target.value;selected=null;selectedPr=null;buffer=null;render()}if(event.target.id==='category'){category=event.target.value;render()}if(event.target.id==='mine-filter'){mineFilter=event.target.value;render()}});
    document.addEventListener('change',event=>{if(event.target.matches('[data-template-field]')){captureTemplate();renderTemplateDialog();document.getElementById('tf-'+event.target.dataset.templateField+'-kind').focus();}});
    render();
  })();
  </script>
</body>
