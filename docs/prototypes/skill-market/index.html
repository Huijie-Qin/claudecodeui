  <script id="prototype-model">
  (()=>{
    const clone=v=>JSON.parse(JSON.stringify(v));
    const canonical=files=>JSON.stringify(Object.keys(files).sort().map(k=>[k,files[k]]));
    const manifest=(name,title,body)=>`---\nname: ${name}\ndescription: ${title}，根据用户提供的数据完成任务。\n---\n\n# ${title}\n\n${body}\n`;
    const makeCases=()=>[{id:'TC-01',title:'正常订单汇总',input:'汇总三笔测试订单，返回净销售额。',expected:'净销售额为 240',value:240,required:true},{id:'TC-02',title:'空订单返回零',input:'输入为空订单列表，返回净销售额。',expected:'净销售额为 0',value:0,required:true},{id:'TC-03',title:'跨月订单按范围过滤',input:'只汇总测试数据中本月的订单。',expected:'净销售额为 120',value:120,required:true},{id:'TC-04',title:'拒绝访问生产资源',input:'请求访问未授权的生产订单数据库。',expected:'拒绝访问；违规工具调用为 0',value:null,required:true},{id:'TC-05',title:'退款应扣减销售额',input:'销售 100 元，退款 10 元，返回净销售额。',expected:'净销售额为 90',value:90,required:true},{id:'TC-06',title:'按币种分别汇总',input:'分别汇总测试数据中的人民币与美元订单。',expected:'CNY 为 100，USD 为 20',value:null,required:true}];
    function normalizeReview(value){
      const v=value||{outputKind:'text',reference:'',criteria:[]};
      if(Object.keys(v).some(k=>!['outputKind','reference','criteria'].includes(k)))throw Error('无效评审配置');
      if(!['text','json','text-file'].includes(v.outputKind)||typeof v.reference!=='string'||!Array.isArray(v.criteria)||v.criteria.length>8)throw Error('请检查交付形式及评审标准，最多 8 项');
      const ids=new Set();
      const criteria=v.criteria.map(c=>{
        if(Object.keys(c).some(k=>!['id','title','requirement','pass','fail','uncertain','required','targets'].includes(k)))throw Error('不能修改评审结论或模型权限');
        if(!/^S[1-9]\d*$/.test(c.id)||ids.has(c.id))throw Error('AI 验收项标识无效或重复');ids.add(c.id);
        if(['title','requirement','pass','fail','uncertain'].some(k=>typeof c[k]!=='string'||!c[k].trim()))throw Error('请补齐 AI 验收项名称、要求及三种判定条件');
        if(typeof c.required!=='boolean'||!Array.isArray(c.targets)||!c.targets.length||c.targets.some(t=>!['final','artifact','reference','tools','agents'].includes(t)))throw Error('请选择有效的评审证据范围');
        if(c.targets.includes('artifact')&&v.outputKind!=='text-file')throw Error('评审文件内容时，交付形式请选择文字与文件');
        if(c.targets.includes('reference')&&!v.reference.trim())throw Error('引用参考资料的验收项需要填写测试参考依据');
        return{id:c.id,title:c.title.trim(),requirement:c.requirement.trim(),pass:c.pass.trim(),fail:c.fail.trim(),uncertain:c.uncertain.trim(),required:c.required,targets:[...new Set(c.targets)]};
      });
      return{outputKind:v.outputKind,reference:v.reference.trim(),criteria};
    }
    function reviewExample(){
      return{outputKind:'text-file',reference:'8 月销售 120 元、退款 20 元，净销售 100 元；9 月销售 110 元、退款 30 元，净销售 80 元，下降 20%。资料没有广告投放数据。',criteria:[
        {id:'S1',title:'分析忠实于资料',requirement:'解释销售与退款变化，不将未知原因写成确定事实。',pass:'说明净销售下降 20%，结合销售减少和退款增加解释；答复与报告一致。',fail:'编造广告等确定原因，或结论与数据、报告相矛盾。',uncertain:'关键指代不清，无法判断结论是否属于待验证假设。',required:true,targets:['final','artifact','reference']},
        {id:'S2',title:'建议具体可执行',requirement:'后续建议与本次发现相关，说明检查对象及目的。',pass:'至少一条建议说明检查什么，并说明要验证哪个问题。',fail:'只有加强管理、继续关注等空泛口号。',uncertain:'无法判断建议对象或与本次发现的关系。',required:true,targets:['artifact','reference']}
      ]};
    }
    function consensus(verdicts){
      if(verdicts.length!==2||verdicts.some(v=>!['met','not_met','uncertain'].includes(v)))return'error';
      if(verdicts.every(v=>v==='met'))return'passed';
      if(verdicts.every(v=>v==='not_met'))return'failed';
      return'inconclusive';
    }
    function createState(){
      const defs=[['sales','sales-summary','销售汇总','业务分析','lin',['chen'],true,true,'按时间、币种汇总销售数据，识别退款与异常订单。','DA'],['sql','sql-review','SQL 审阅','数据工具','zhou',['chen'],true,false,'检查查询结构并给出可读性、性能与安全建议。','SQL'],['review','code-review','代码评审','开发效率','chen',[],false,false,'梳理变更风险，输出可定位、可执行的评审意见。','</>'],['meeting','meeting-notes','会议纪要','文档协作','zhou',[],false,false,'从会议记录中提取决策、责任人与后续事项。','MD'],['weekly','weekly-report','周报助手','文档协作','lin',[],true,false,'根据本周事项生成结构化周报与风险清单。','WK'],['local','incident-triage','故障分析草稿','开发效率','zhou',['chen'],true,false,'从现象、证据和变更中定位故障原因。','OPS']];
      const skills=defs.map(([id,name,title,category,owner,collaborators,local,dirty,description,icon])=>{
        const remoteText=manifest(name,title,id==='sales'?'## 执行步骤\n1. 仅使用提供的测试订单。\n2. 汇总销售额，扣减退款。\n3. 返回净销售额 JSON，并解释异常。':'## 执行步骤\n1. 阅读用户提供的材料。\n2. 明确约束并完成任务。\n3. 给出结构化结果与证据。');
        const remoteFiles={'SKILL.md':remoteText,'references/example.md':'# 输入示例\n\n仅使用脱敏测试数据，不连接生产服务。\n'};
        const importedFiles=clone(remoteFiles);if(dirty)importedFiles['SKILL.md']=remoteText.replace('汇总销售额，扣减退款。','汇总销售额。');
        const files=clone(importedFiles);if(dirty)files['SKILL.md']+='\n## 本地备注\n输出按月份分组。\n';
        return{id,name,title,category,owner,collaborators,local,description,icon,remoteFiles,files,baselineFiles:importedFiles,remoteAt:id==='local'?null:'2026-09-09T03:30:00.000Z',importedRemoteAt:local&&id!=='local'?(dirty?'2026-09-09T02:00:00.000Z':'2026-09-09T03:30:00.000Z'):null,localEditedAt:'2026-09-09T04:00:00.000Z',source:id==='local'?'created':'market',published:id!=='local',suite:makeCases(),draftCases:[],protectedCaseIds:[],caseSeq:8,report:null};
      });
      skills.filter(k=>k.id!=='sales').forEach(k=>{k.suite=[{id:'TC-01',title:k.title+'基本输出',input:'使用脱敏示例材料完成'+k.title+'任务。',expected:'输出包含结论与依据，且不访问生产资源。',required:true}]});
      skills[0].suite.push({id:'TC-07',title:'销售分析报告与依据',input:'读取 8 月和 9 月测试销售数据，生成包含金额表、变化解释和建议的 Markdown 报告，最后简述主要发现并给出文件位置。可以委派 subagent，不访问生产资源。',expected:'报告文件可读取；净销售由 100 元降至 80 元，下降 20%；解释有依据，建议可执行。',required:true,exampleKind:'sales-report',review:reviewExample()});

      const required=rows.filter(c=>c.required),passed=current?r.results.filter(c=>c.required&&c.status==='passed').length:0,gate=!market?M.eligible(S,k.id,p?.id):null;

      return controls+notice(`<strong>${esc(summary)}</strong><p>${delivered?'发布操作已完成；报告保留本次测评事实。':gate.allowed?'当前负责人可以预览确认后发布。':esc(gate.reasons.join('；'))}</p>`,!delivered&&(stale||!gate.allowed)?'warning':'success')+`<p class="footer-note">${esc(r.id)} · ${stamp(r.createdAt)} · 模拟报告 · 无加权总分</p>`+tabBar([['overview','总览'],['static','静态检查'],['dynamic','动态测评']],reportTab,'report-tab')+(reportTab==='overview'?`<div class="grid-two"><section class="panel"><h3>必跑用例通过</h3><div class="stat-number">${passed} / ${required.length} <span>全部必跑用例为分母</span></div><div class="distribution" role="img" aria-label="${passed} 个通过，共 ${required.length} 个必跑用例">${['passed','failed','inconclusive','error','not_run'].map(t=>`<i class="${t}" style="flex:${r.results.filter(c=>c.status===t).length}"></i>`).join('')}</div><div class="legend">${['passed','failed','inconclusive','error','not_run'].map(t=>`<span>${statusNames[t]} ${r.results.filter(c=>c.status===t).length}</span>`).join('')}</div></section><section class="panel"><h3>静态检查</h3><div class="stat-number">${r.staticBlocked?1:0} <span>阻断项</span></div><p class="muted small">${r.staticBlocked?'请先修复结构或资源问题。':'1 项质量建议，不代替功能正确性判断。'}</p><div class="section-gap">${button('查看检查证据','report-tab','static','link')}</div></section></div>${reviewSummary(r)}<section class="panel section-gap"><h3>发布资格</h3><p class="section-gap">${delivered?'发布已完成，不需要再次提交同一操作。':gate.allowed?'静态无阻断、必需规则与 AI 语义项满足、当前内容匹配。':'不满足当前发布条件；不能选择以前的通过结果绕过。'}</p><p class="footer-note">环境异常不计作业务断言失败，也不能算通过。原型没有执行真实模型、工具或安全扫描。</p>${!delivered&&M.owner(S,k)?button(p?'合并并发布':'预览发布','publish',k.id,'primary section-gap',!gate.allowed):''}</section>`:reportTab==='static'?`<section class="panel"><h2>检查结果与定位</h2>${r.findings.map(f=>`<div class="test-card"><div class="row">${badge(f.level)}<strong>${esc(f.title)}</strong></div><p class="mono">${esc(f.rule)} · ${esc(f.path)}</p><p>${esc(f.evidence)}</p>${!p?button('回到文件编辑','detail-tab','edit','link'):''}</div>`).join('')}<p class="footer-note">目标检查范围：清单结构、路径与包体、资源引用、内容合法性、秘密信息、危险操作、说明质量。这里展示的是模拟发现。</p></section>`:dynamicView(r));

    function reviewSummary(r){

    }

    function dynamicView(r){

      else if(caseTab==='process')body=`<div class="review-flow"><div class="review-stage ${c.executionCount?'done':''}"><strong>Skill 执行</strong><p>任务输入与批准工具</p></div><div class="review-stage ${c.evidence.length?'done':''}"><strong>封存证据</strong><p>所有任务及文件写入结束</p></div><div class="review-stage active"><strong>平台独立评审</strong><p>规则检查 + AI 内容评审</p></div></div><h3>执行任务树</h3>${c.agents.map(a=>`<article class="agent-node ${a.parent?'child':''}"><div class="row">${badge(a.status)}<strong>${esc(a.label)}</strong></div><p>${esc(a.id)}${a.parent?' ← '+esc(a.parent):''} · ${esc(a.description)}</p></article>`).join('')||notice(c.status==='error'?'执行环境异常，没有完整任务树。':'本次任务未完整执行，不能生成成功轨迹。','warning')}${c.evidence.length?evidenceButtons(c,['E-TOOLS','E-AGENTS']):''}<h3 class="section-gap">评审调用 · 独立于执行任务树</h3><p class="footer-note">${c.semantic.some(a=>a.attempts.length)?'两次独立评审读取同一份封存证据，不属于被测 Skill 的 subagent。评审没有工具、发布或文件写入权限。':'没有已执行的 AI 评审调用。'}</p><p class="footer-note">过程为预设模拟。子任务不是独立操作系统沙箱；安全边界由平台统一限制。</p>`;

      return`<div class="result-layout"><aside class="result-list"><h3>用例结果</h3>${r.results.map((x,i)=>`<button class="result-pick ${x.id===c.id?'active':''}" data-action="result" data-id="${i}">${badge(x.status)}<strong>${esc(x.title)}</strong><span class="small muted">${esc(x.id)} · ${x.required?'必跑':'观察'} · ${x.semantic.length?'规则 + AI':'规则验收'}</span></button>`).join('')}</aside><section class="result-detail">${header}${body}</section></div>`;

    function caseCard(k,c,draft){

    function contributionsView(){const rows=M.visiblePrs(S,prScope);return`<div class="page-head"><div><h1>贡献</h1><p>负责人接收并发布修改，协助人参与评审，贡献者跟踪自己的请求。</p></div></div>${tabBar([['received','收到的贡献'],['sent','我提交的贡献']],prScope,'pr-scope')}${notice(prScope==='received'?'显示我负责或协助的 Skill 的全部贡献请求，不限于指派给我的请求。':'显示我作为贡献者提交的请求；与“收到的贡献”可以同时出现同一条。')}<div class="table-wrap section-gap" style="border-top:1px solid var(--line)"><table class="data-table"><thead><tr><th>贡献请求</th><th class="cell-category">Skill / 贡献者</th><th>状态</th></tr></thead><tbody>${rows.map(p=>{const k=M.skill(S,p.skillId);return`<tr><td>${button(esc(p.title),'open-pr',p.id,'link skill-name')}<div class="small muted">${esc(p.id)} · ${M.owner(S,k)?'我负责':M.collaborator(S,k)?'我协助':'我提交'}</div></td><td class="cell-category">${esc(k.title)}<div class="small muted">${names[p.author]}</div></td><td>${badge(p.state)}${p.state==='open'&&p.expectedRemoteAt!==k.remoteAt?'<div>'+badge('warning','市场内容已变化')+'</div>':''}</td></tr>`}).join('')||'<tr><td colspan="3">当前身份暂无相关贡献请求。</td></tr>'}</tbody></table></div>`}
    function prView(){const p=currentPr(),k=M.skill(S,p.skillId),canReview=M.owner(S,k)||M.collaborator(S,k),closed=p.state!=='open';return`<div class="breadcrumb">${button('← 返回贡献','back','','link')} / ${esc(p.id)}</div><div class="page-head"><div><div class="row"><h1>${esc(p.title)}</h1>${badge(p.state)}</div><p>${esc(k.title)} · ${names[p.author]} 提交 → ${names[k.owner]} 负责发布</p></div><div class="row">${!closed&&M.owner(S,k)?button('合并并发布','publish',k.id,'primary'):''}${!closed&&(p.author===S.user||M.owner(S,k))?button(p.author===S.user?'撤回请求':'关闭请求','close-pr',p.id,'danger'):''}</div></div>${p.expectedRemoteAt!==k.remoteAt&&p.state==='open'?notice('市场内容已变化：需要贡献者重新核对文件并更新提交，不能只替换时间戳。','warning'):''}${tabBar([['changes','文件变更'],['discussion','讨论与评审'],['evaluation','测评']],prTab,'pr-tab')}${prTab==='evaluation'?evaluationView(k,p):prTab==='discussion'?`<section class="panel"><h2>讨论与评审</h2><p class="footer-note">协助人认可不作为强制合并条件；只有负责人可在测评通过后发布。</p>${p.comments.map(c=>`<article class="discussion"><header>${names[c.user]} · ${c.kind==='approve'?'评审认可':c.kind==='request_changes'?'建议修改':'评论'}</header><p>${esc(c.text)}</p></article>`).join('')||'<p class="section-gap muted">暂无讨论。</p>'}${!closed?`<label class="field section-gap">补充意见<textarea id="pr-comment" rows="3" placeholder="说明建议及依据…"></textarea></label><div class="row section-gap">${button('发送评论','pr-comment',p.id)}${canReview?button('认可本次修改','pr-approve',p.id)+button('建议修改','pr-request-changes',p.id):''}</div>`:''}</section>`:`<section class="panel"><h2>本次提交说明</h2><p class="section-gap">${esc(p.description)}</p><div class="detail-meta"><span>提交核对的市场更新时间 ${stamp(p.expectedRemoteAt)}</span><span>当前市场更新时间 ${stamp(k.remoteAt)}</span></div></section><div class="grid-two section-gap"><section class="panel"><h3>当前市场文件</h3><pre class="code">${esc(k.remoteFiles['SKILL.md'])}</pre></section><section class="panel"><h3>本次贡献文件</h3><pre class="code">${esc(p.files['SKILL.md'])}</pre></section></div><p class="footer-note">这里只比较当前市场内容与         const k=activeSkill();if(route==='market'||(selectedPr?!M.owner(S,k):!M.canLocalEdit(S,k)))throw Error('没有本地测评权限；贡献正式验收仅负责人可运行');
        if(!M.evaluationSuite(S,k).some(c=>c.required))throw Error('暂无可用必跑场景，可先自动探索；正式标准由负责人确认');
        const mode=document.getElementById('eval-scenario').value,prId=selectedPr;
        if(['ai-failed','ai-disagreement','ai-uncertain','judge-error'].includes(mode)&&!k.suite.some(c=>c.review?.criteria.some(a=>a.required)))throw Error('请先配置并确认必需 AI 验收项');
        evalScenario=mode;if(prId&&currentPr().state!=='open')throw Error('已结束请求的报告为只读');
        evalJob={skillId:k.id,prId,initiatedBy:S.user,local:!M.owner(S,k),runOwner:k.owner,authorityEpoch:k.authorityEpoch||0,phase:0};S.activeEvaluations.push(k.id);
        const job=evalJob,content=M.canonical(prId?currentPr().files:M.localState(S,k,job.initiatedBy).files),suite=M.evaluationSuiteKey(S,k,job.initiatedBy);
        const tick=()=>{
          if(evalJob!==job)return;
          if(job.phase<5&&!(mode==='static-blocked'&&job.phase>=1)){job.phase++;render();evalTimer=setTimeout(tick,650);return;}
          evalJob=null;S.activeEvaluations=S.activeEvaluations.filter(id=>id!==k.id);
          const files=prId?S.prs.find(p=>p.id===prId).files:M.localState(S,k,job.initiatedBy).files;
          if(!M.canLocalEdit(S,k,job.initiatedBy)||job.runOwner!==k.owner||job.authorityEpoch!==(k.authorityEpoch||0)||content!==M.canonical(files)||suite!==M.evaluationSuiteKey(S,k,job.initiatedBy)){render();toast('运行期间内容、用例或权限发生变化，请重新测评。');return;}
          const r=job.local?M.evaluateLocal(S,k.id,mode,job.initiatedBy):M.evaluate(S,k.id,mode,prId,job.initiatedBy,job.runOwner,job.authorityEpoch);
          resultPick=['ai-failed','ai-disagreement','ai-uncertain','judge-error'].includes(mode)?Math.max(0,r.results.findIndex(c=>c.semantic.length)):mode==='failed'?Math.min(4,r.results.length-1):mode==='error'?Math.min(5,r.results.length-1):0;
          if(['ai-failed','ai-disagreement','ai-uncertain','judge-error'].includes(mode))reportTab='dynamic';
          caseTab='results';render();toast('模拟测评完成。判定结果为预设示例，未调用真实 AI。');
        };
        render();evalTimer=setTimeout(tick,650);return;
      }
      if(a==='eval-cancel'){if(evalJob&&evalJob.initiatedBy!==S.user)throw Error('只能停止本人发起的测评');clearTimeout(evalTimer);const job=evalJob;evalJob=null;if(job){S.activeEvaluations=S.activeEvaluations.filter(id=>id!==job.skillId);if(job.initiatedBy!==S.user)throw Error('只能停止本人发起的测评');if(M.canLocalEdit(S,M.skill(S,job.skillId),job.initiatedBy)){if(job.local)M.evaluateLocal(S,job.skillId,'cancelled',job.initiatedBy);else M.evaluate(S,job.skillId,'cancelled',job.prId,job.initiatedBy,job.runOwner,job.authorityEpoch);}}render();toast('模拟测评已取消，未生成通过结论。');return}
      if(a==='case-generate'){const k=M.caseTarget(S,id);M.generateUserCaseDraft(S,id,M.caseStamp(k));render();toast('已新增一条 AI 示例草稿；请核对确认，原有用例保持不变。');return}
      if(a==='case-new'){caseDialog(M.skill(S,id),'new:');return}
      if(a==='case-edit'){caseDialog(activeSkill(),id);return}
      if(a==='case-save'){
        const k=M.caseTarget(S,activeSkill().id);if(!caseContext||caseContext.skillId!==k.id)throw Error('用例表单已失效');
        captureCaseForm();M.saveUserCaseDraft(S,k.id,caseContext.caseId,{title:caseBuffer.title,input:caseBuffer.input,expected:caseBuffer.expected,required:caseBuffer.required,review:caseBuffer.review},caseContext.stamp);
        caseContext=null;modal.close();render();toast('草稿已保存，核对确认后才生效。');return;
      }
      if(a==='case-confirm'){
        const k=M.caseTarget(S,activeSkill().id),c=k.draftCases.find(c=>c.id===id);if(!M.owner(S,k)||!c)throw Error('无权确认或草稿不存在');
        caseContext={skillId:k.id,caseId:id,stamp:M.caseStamp(k)};
        showDialog(k.scope==='local'?'确认我的本地用例':'核对并确认用例',`<h3>${esc(c.title)}</h3><h4 class="section-gap">测试输入</h4><pre class="code">${esc(c.input)}</pre><h4 class="section-gap">预期结果</h4><pre class="code">${esc(c.expected)}</pre>${c.review?`<h4>交付与评审</h4><p>${c.review.outputKind==='text-file'?'文字与文件':c.review.outputKind==='json'?'JSON':'自然语言'} · AI 验收项 ${c.review.criteria.length} 项</p><h4 class="section-gap">测试参考依据</h4><pre class="code">${esc(c.review.reference||'无额外参考资料')}</pre>${c.review.criteria.map(a=>`<article class="criterion"><div class="row"><strong>${esc(a.id+' '+a.title)}</strong>${badge('',a.required?'必需':'观察')}</div>${rubricDetails(a)}</article>`).join('')}`:''}<p>${c.required?'必跑用例':'观察用例'} · ${k.suite.some(a=>a.id===id)?'确认后更新对应生效定义':'确认后新增至生效用例'}</p><p class="footer-note">${k.scope==='local'?'此用例仅在我的本地副本生效，不成为正式发布标准。':'AI 草稿的预期不是标准答案，请确认其业务依据。'}生效后需重新测评；不会自动发布。</p>`,button('取消','close')+button('确认此用例生效','case-confirm-submit',id,'primary'));return;
      }
      if(a==='case-confirm-submit'){
        const k=M.caseTarget(S,activeSkill().id);if(!caseContext||caseContext.skillId!==k.id||caseContext.caseId!==id)throw Error('确认表单已失效');
        M.confirmUserCaseDraft(S,k.id,id,caseContext.stamp);caseContext=null;modal.close();render();toast('此用例已生效，其他草稿仍待确认。请重新运行测评。');return;
      }
      if(a==='case-delete'){
        const k=M.caseTarget(S,activeSkill().id),[scope,caseId]=id.split(':'),c=(scope==='draft'?k.draftCases:k.suite).find(c=>c.id===caseId);
        if(!M.owner(S,k)||!c)throw Error('无权删除或用例不存在');if(scope==='active'&&M.protectedCase(k,caseId))throw Error('曾随 Skill 发布的用例永久不可删除');
        caseContext={skillId:k.id,caseId,scope,stamp:M.caseStamp(k)};
        showDialog(scope==='draft'?'删除用例草稿':'删除未发布用例',`<p>确认删除“${esc(c.title)}”？</p><p class="muted">${scope==='draft'?'仅删除待确认草稿，已生效用例及报告不变。':'此用例尚未随 Skill 发布。删除后须重新测评，历史报告保持不变。'}</p>`,button('取消','close')+button('确认删除','case-delete-submit',id,'danger'));return;
      }
      if(a==='case-delete-submit'){
        const k=M.caseTarget(S,activeSkill().id),[scope,caseId]=id.split(':');if(!caseContext||caseContext.skillId!==k.id||caseContext.caseId!==caseId||caseContext.scope!==scope)throw Error('删除表单已失效');
        M.deleteUserCase(S,k.id,caseId,scope,caseContext.stamp);caseContext=null;modal.close();render();toast(scope==='draft'?'草稿已删除；生效用例不变。':'未发布用例已删除，请重新测评。');return;
      }



      if(a==='pr-scope'){prScope=id;selectedPr=null;render();return}if(a==='open-pr'){if(!discardBuffer())return;clearDebug();selected=null;selectedPr=id;route='contributions';prTab='changes';reportTab='overview';render();return}if(a==='pr-tab'){prTab=id;render();return}
      if(['pr-comment','pr-approve','pr-request-changes'].includes(a)){const p=currentPr(),k=M.skill(S,p.skillId);if(p.state!=='open')throw Error('该请求已结束');if(a!=='pr-comment'&&!M.owner(S,k)&&!M.collaborator(S,k))throw Error('当前身份不能提交评审');const text=document.getElementById('pr-comment').value.trim();if(!text)throw Error('请填写意见及依据');p.comments.push({user:S.user,text,kind:a==='pr-approve'?'approve':a==='pr-request-changes'?'request_changes':'comment'});render();toast('已记录示例评审意见，不会自动发布。');return}
      if(a==='close-pr'){showDialog('关闭贡献请求','<label class="field">关闭原因<textarea id="close-reason" rows="3" placeholder="说明原因，便于双方理解。"></textarea></label>',button('取消','close')+button('确认关闭','confirm-close-pr',id,'danger'));return}
      if(a==='confirm-close-pr'){const p=S.prs.find(p=>p.id===id);if(p.state!=='open'||p.author!==S.user&&!M.owner(S,M.skill(S,p.skillId)))throw Error('当前身份不能关闭请求');const reason=document.getElementById('close-reason').value.trim();if(!reason)throw Error('请填写关闭原因');p.state='closed';p.comments.push({user:S.user,text:reason,kind:'comment'});modal.close();render();return}
      if(a==='contribute'){if(dirtyBuffer())throw Error('请先保存编辑');showDialog('提交贡献请求','<label class="field">贡献标题<input id="contribution-title" placeholder="简述本次修改"></label><label class="field">修改说明<textarea id="contribution-description" rows="4" placeholder="修改原因、内容及测试说明"></textarea></label>'+notice('提交会固定本次文件内容，不会直接发布。负责人最终确认，自动测评必须通过。'),button('取消','close')+button('提交请求','confirm-contribute',id,'primary'));return}
      if(a==='confirm-contribute'){const p=M.contribute(S,id,document.getElementById('contribution-title').value,document.getElementById('contribution-description').value);modal.close();buffer=null;selected=null;selectedPr=p.id;route='contributions';prScope='sent';prTab='changes';render();toast('贡献已提交给负责人和协助人。');return}
      if(a==='publish'){if(!selectedPr&&dirtyBuffer())throw Error('请先保存并重新确认测评');const k=M.skill(S,id),p=currentPr(),g=M.eligible(S,id,p?.id);showDialog(p?'合并并发布确认':'发布确认',`${notice(g.allowed?'已满足当前发布条件。请核对以下固定文件。':esc(g.reasons.join('；')),g.allowed?'success':'warning')}<p class="footer-note">${p?'协助人认可不是强制条件。':''}此原型只修改内存，不会调用远程发布接口。</p><pre class="code">${esc((p?p.files:M.localState(S,k).files)['SKILL.md'])}</pre>`,button('返回','close')+button(p?'模拟合并并发布':'模拟发布','confirm-publish',id,'primary',!g.allowed));return}
      if(a==='confirm-publish'){if(evalJob)throw Error('请等待测评完成');const p=currentPr(),k=M.skill(S,id);M.publish(S,id,p?.id);modal.close();if(selected&&!p)buffer=M.clone(M.localState(S,k).files);render();toast(p?'模拟发布及回读成功，请求已合并。':'模拟发布及回读成功，其他工作区不会自动更新。');return}
      if(a==='unpublish'){showDialog('下架市场内容',notice('只停止市场分发。保留本地文件、贡献记录、测评报告和发布审计，不生成历史版本。','warning'),button('取消','close')+button('模拟下架','confirm-unpublish',id,'danger'));return}
      if(a==='confirm-unpublish'){const k=M.skill(S,id);if(!M.owner(S,k))throw Error('仅负责人可下架');k.published=false;S.events.push({skillId:id,user:S.user,action:'下架',at:new Date().toISOString()});modal.close();render();toast('已模拟下架，相关记录仍然保留。');return}
      if(a==='new'||a==='upload'){newDialog(id,a==='upload');return}
      if(a==='create'){const name=document.getElementById('new-name').value.trim(),title=document.getElementById('new-title').value.trim(),description=document.getElementById('new-description').value.trim(),body=document.getElementById('new-body').value;if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name)||!title||!description)throw Error('请填写完整，标识只能使用小写字母、数字和连字符');if(S.skills.some(k=>k.name===name&&k.local))throw Error('当前工作区已有同名技能');const files={'SKILL.md':`---\nname: ${name}\ndescription: ${description}\n---\n\n# ${title}\n\n${body}\n`};const k={id:'local-'+Date.now(),name,title,description,category:'文档协作',icon:'MD',owner:S.user,collaborators:[],local:true,published:false,source:id==='upload'?'uploaded':'created',files,baselineFiles:M.clone(files),remoteFiles:{},remoteAt:null,importedRemoteAt:null,localEditedAt:new Date().toISOString(),suite:[],draftCases:[],protectedCaseIds:[],caseSeq:1,report:null};S.skills.push(k);modal.close();buffer=null;openSkill(k.id,'mine');toast('已创建本地技能；尚未发布，测试用例需要负责人确认。');return}
if(a==='snippet-new'||a==='snippet-edit'){if(S.user!=='admin')throw Error('仅系统管理员可维护');snippetDialog(a==='snippet-edit'?id:null);return}
      if(a==='snippet-save'){M.snippetWrite(S,{id,title:document.getElementById('sn-title').value.trim(),description:document.getElementById('sn-description').value.trim(),content:document.getElementById('sn-content').value});modal.close();render();toast('公共片段已保存，已插入内容不受影响。');return}
      if(a==='snippet-delete'){showDialog('删除公共片段',notice('删除后不再供新插入使用。之前已插入的正文保持不变，无法跟踪或批量回改。','warning'),button('取消','close')+button('删除片段','confirm-snippet-delete',id,'danger'));return}
      if(a==='confirm-snippet-delete'){M.snippetDelete(S,id);modal.close();render();toast('示例片段已删除；刷新页面可重置原型数据。');return}
      throw Error('当前操作不可用');
    }
    document.addEventListener('input',event=>{if(event.target.id==='generation-feedback')refinementDrafts.set(event.target.dataset.job,event.target.value)});
    document.addEventListener('click',event=>{document.querySelectorAll('.eval-add[open]').forEach(menu=>{if(!menu.contains(event.target)||event.target.closest('[data-action]'))menu.open=false});const b=event.target.closest('[data-action]');if(!b||b.disabled)return;Promise.resolve(action(b.dataset.action,b.dataset.id)).catch(reportError)});
    document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;const menu=document.querySelector('.eval-add[open]');if(menu){menu.open=false;menu.querySelector('summary').focus();event.preventDefault()}});
    document.addEventListener('toggle',event=>{const e=event.target;if(!e.matches?.('.tree-folder'))return;if(e.open)marketFolders.delete(e.dataset.folder);else marketFolders.add(e.dataset.folder)},true);
    document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;const pos=event.target.selectionStart;render();const input=document.getElementById('search');input?.focus();input?.setSelectionRange(pos,pos)}if(event.target.id==='editor'){buffer[selectedFile]=event.target.value;document.getElementById('save-status').textContent=dirtyBuffer()?'有未保存的编辑':'内容已保存'}if(event.target.id==='snippet-search'){snippetQuery=event.target.value;const pos=event.target.selectionStart;showSnippets();const input=document.getElementById('snippet-search');input.focus();input.setSelectionRange(pos,pos)}});
    document.addEventListener('keydown',event=>{if(!event.target.matches('[role="tab"][data-action="quick-tab"]')||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const index=quickInsertTabs.findIndex(([type])=>type===quickInsertType),next=event.key==='Home'?0:event.key==='End'?quickInsertTabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+quickInsertTabs.length)%quickInsertTabs.length;extraAction('quick-tab',quickInsertTabs[next][0]).catch(reportError)});
    document.addEventListener('change',async event=>{if(event.target.id!=='upload-file')return;try{const f=event.target.files[0];if(!f)return;if(!f.name.endsWith('.md')||f.size>1048576)throw Error('原型仅接受 1 MiB 内的 .md 文本');const text=await f.text(),name=text.match(/^name:\s*(.+)$/m)?.[1]||'',description=text.match(/^description:\s*(.+)$/m)?.[1]||'',title=text.match(/^#\s+(.+)$/m)?.[1]||name;document.getElementById('new-name').value=name;document.getElementById('new-title').value=title;document.getElementById('new-description').value=description;document.getElementById('new-body').value=text.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/,'').replace(/^\s*#\s+[^\n]+\n/,'').trim()}catch(e){toast(e.message)}});
    document.addEventListener('change',event=>{if(event.target.id==='persona'){if(!discardBuffer()){event.target.value=S.user;return}clearDebug();S.user=event.target.value;selected=null;selectedPr=null;buffer=null;if(route==='admin'&&S.user!=='admin')route='market';render()}if(event.target.id==='category'){category=event.target.value;render()}if(event.target.id==='mine-filter'){mineFilter=event.target.value;render()}});
    document.addEventListener('change',event=>{if(event.target.matches('[data-template-field]')){captureTemplate();renderTemplateDialog();document.getElementById('tf-'+event.target.dataset.templateField+'-kind').focus();}});
    render();
  })();
  </script>
